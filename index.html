<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celil’s Idea Tree — Celil’in Fikir Ağacı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-linen: #F2ECE1;
      --text-ink: #181615;
      --accent-seal: #8F2D1E;
      --accent-gold: #B87D3B;
      --rule-line: rgba(24, 22, 21, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; background: #F2ECE1; }
    body {
      background: #F2ECE1;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-ink);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #bespoke-stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      border-radius: 0px;
      overflow: hidden;
      background-color: var(--bg-linen);
      background-image:
        radial-gradient(circle at 78% 50%, rgba(143, 45, 30, 0.06) 0%, transparent 60%),
        repeating-linear-gradient(0deg, rgba(24, 22, 21, 0.012) 0px, rgba(24, 22, 21, 0.012) 1px, transparent 1px, transparent 3px);
      color: var(--text-ink);
      border: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.35rem 2.2rem;
    }

    #sapling-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* TOP HEADER */
    .stage-header {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--rule-line);
      padding-bottom: 0.65rem;
    }

    .brand-title {
      letter-spacing: 0.24em;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-ink);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .leaf-nav-pills {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .leaf-pill {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-ink);
      opacity: 0.52;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 14px;
      font-weight: 600;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .leaf-pill:hover {
      opacity: 0.9;
      border-color: var(--rule-line);
    }

    .leaf-pill.active {
      opacity: 1;
      color: #F2ECE1;
      background: var(--accent-seal);
      border-color: var(--accent-seal);
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--rule-line);
      border-radius: 5px;
      overflow: hidden;
      background: rgba(24, 22, 21, 0.04);
    }

    .lang-btn {
      background: transparent;
      border: none;
      padding: 0.22rem 0.55rem;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-ink);
      opacity: 0.55;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--accent-seal);
      color: #F2ECE1;
      opacity: 1;
    }

    /* CENTER STAGE: BESPOKE MODIFIED ARTWORK + QUOTE + ROOT NOTE */
    .stage-content {
      position: relative;
      z-index: 3;
      margin: auto 0;
      max-width: 63%;
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 1.35rem;
      align-items: center;
      pointer-events: none;
      transition: opacity 0.26s ease, transform 0.26s ease;
    }

    .artwork-frame {
      position: relative;
      width: 310px;
      height: 205px;
      border-radius: 10px;
      padding: 6px;
      background: #EAE2D3;
      border: 1px solid rgba(143, 45, 30, 0.35);
      box-shadow:
        0 14px 32px rgba(24, 22, 21, 0.14),
        inset 0 0 0 1px rgba(255, 255, 255, 0.45);
      pointer-events: auto;
      overflow: hidden;
      transition: transform 0.35s ease;
    }

    .artwork-frame:hover {
      transform: scale(1.025);
    }

    #artwork-canvas {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      display: block;
    }

    .artwork-caption-badge {
      position: absolute;
      bottom: 11px;
      right: 12px;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(24, 22, 21, 0.72);
      backdrop-filter: blur(4px);
      color: #F2ECE1;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .quote-column {
      display: flex;
      flex-direction: column;
    }

    .leaf-tag {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 1.02rem;
      color: var(--accent-seal);
      margin-bottom: 0.3rem;
      letter-spacing: 0.03em;
    }

    .quote-heading {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.65rem, 2.7vw, 2.35rem);
      line-height: 1.13;
      color: var(--text-ink);
      margin-bottom: 0.55rem;
    }

    .quote-author {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.0rem;
      color: var(--text-ink);
      opacity: 0.78;
      margin-bottom: 0.75rem;
    }

    .quote-root {
      font-size: 0.82rem;
      line-height: 1.58;
      color: var(--text-ink);
      opacity: 0.84;
      padding-left: 0.85rem;
      border-left: 2px solid var(--accent-seal);
    }

    /* FOOTER */
    .stage-footer {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--rule-line);
      padding-top: 0.65rem;
      font-size: 11.5px;
    }

    .footer-hint {
      opacity: 0.7;
      font-style: italic;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 13.5px;
    }

    .nav-buttons {
      display: flex;
      gap: 0.45rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--accent-seal);
      color: var(--text-ink);
      padding: 0.32rem 0.82rem;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: var(--accent-seal);
      color: #F2ECE1;
    }

    @media (max-width: 820px) {
      #bespoke-stage {
        padding: 1.1rem 1.2rem;
      }
      .stage-content {
        max-width: 100%;
        grid-template-columns: 1fr;
        gap: 0.75rem;
        background: rgba(242, 236, 225, 0.86);
        backdrop-filter: blur(4px);
        padding: 0.8rem;
        border-radius: 10px;
      }
      .artwork-frame {
        width: 100%;
        max-width: 260px;
        height: 145px;
      }
      .footer-hint {
        display: none;
      }
    }
  </style>
</head>
<body>

  <main id="bespoke-stage">
    <canvas id="sapling-canvas"></canvas>

    <header class="stage-header">
      <div class="brand-title" id="brand-title">CELIL’S IDEA TREE</div>

      <div class="header-controls">
        <nav class="leaf-nav-pills" id="leaf-pills" aria-label="Leaf Selection"></nav>
        <div class="lang-switch" role="group" aria-label="Language Switch">
          <button type="button" class="lang-btn active" id="lang-en">EN</button>
          <button type="button" class="lang-btn" id="lang-tr">TR</button>
        </div>
      </div>
    </header>

    <article class="stage-content" id="stage-content">
      <div class="artwork-frame" title="Living Scene">
        <canvas id="artwork-canvas" width="470" height="312"></canvas>
        <span class="artwork-caption-badge" id="artwork-badge">GIVERNY · LIVING CANVAS</span>
      </div>

      <div class="quote-column">
        <div class="leaf-tag" id="leaf-tag">Sapling · Leaf I</div>
        <h1 class="quote-heading" id="quote-heading"></h1>
        <div class="quote-author" id="quote-author"></div>
        <p class="quote-root" id="quote-root"></p>
      </div>
    </article>

    <footer class="stage-footer">
      <span class="footer-hint" id="footer-hint">Touch the leaves (I – V) on the living sapling or use the buttons to explore</span>
      <div class="nav-buttons">
        <button class="nav-btn" id="prev-btn" type="button">← Prev</button>
        <button class="nav-btn" id="next-btn" type="button">Next Leaf →</button>
      </div>
    </footer>
  </main>

          r: "Kalabalıklar 'Tükendi' yazan sahte vitrinlere doğru körlemesine koşarken, o fare yarışından çıkıp kendi yolunu kurmak yalnızca bir dakikalık zihniyet değişimi ve karar mesafesindedir."
        }
      },
      {
        num: "V",
        imgKey: "saadi_ink",
        badge: { en: "GULISTAN · TONE & BLADE", tr: "GÜLİSTAN · ÜSLUP VE KILICIN KESİĞİ" },
        en: {
          q: "“Wrong delivery is the executioner of a true word.”",
          a: "Saadi Shirazi — Gulistan (Chapter VIII)",
          r: "The truth of a statement does not depend on its tone; yet its ability to reach another human mind almost always does. The speaker is responsible for the grace of the delivery, and the listener for separating the essence from the vessel."
        },
        tr: {
          q: "“Yanlış üslup, doğru sözün celladıdır.”",
          a: "Sadi Şirazî — Gülistan (VIII. Bab)",
          r: "Doğrunun doğruluğu üsluba bağlı değildir; fakat insana ulaşabilmesi çoğu zaman üsluba bağlıdır. Söyleyen doğrunun üslubundan, dinleyen de doğrunun özünü üsluptan ayırabilmekten sorumludur."
        }
      }
    ];

    let currentLang = "en"; // Starts in EN for StudyStream international visitors
    let activeLeaf = 0;

    const pillsContainer = document.getElementById("leaf-pills");
    const contentEl = document.getElementById("stage-content");

    function renderPills() {
      pillsContainer.innerHTML = "";
      LEAVES_DATA.forEach((item, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "leaf-pill" + (idx === activeLeaf ? " active" : "");
        btn.textContent = item.num;
        btn.onclick = () => selectLeaf(idx);
        pillsContainer.appendChild(btn);
      });
    }

    function applyTextContent() {
      const ui = UI_TEXT[currentLang];
      const item = LEAVES_DATA[activeLeaf];
      const loc = item[currentLang];

      document.getElementById("brand-title").textContent = ui.brand;
      document.getElementById("leaf-tag").textContent = `${ui.leafPrefix} ${item.num}`;
      document.getElementById("artwork-badge").textContent = item.badge[currentLang];
      document.getElementById("quote-heading").textContent = loc.q;
      document.getElementById("quote-author").textContent = loc.a;
      document.getElementById("quote-root").textContent = loc.r;
      document.getElementById("footer-hint").textContent = ui.hint;
      document.getElementById("prev-btn").textContent = ui.prev;
      document.getElementById("next-btn").textContent = ui.next;
    }

    function selectLeaf(idx, rippleCoords) {
      activeLeaf = (idx + LEAVES_DATA.length) % LEAVES_DATA.length;

      contentEl.style.opacity = "0";
      contentEl.style.transform = "translateY(5px)";

      setTimeout(() => {
        applyTextContent();
        contentEl.style.opacity = "1";
        contentEl.style.transform = "translateY(0)";
      }, 130);

      renderPills();

      if (rippleCoords) {
        ripples.push({ x: rippleCoords.x, y: rippleCoords.y, r: 4, alpha: 0.85 });
      } else if (leafHitboxes[activeLeaf]) {
        ripples.push({ x: leafHitboxes[activeLeaf].x, y: leafHitboxes[activeLeaf].y, r: 4, alpha: 0.7 });
      }
    }

    function setLanguage(lang) {
      if (lang === currentLang) return;
      currentLang = lang;
      document.documentElement.lang = lang;
      document.getElementById("lang-en").classList.toggle("active", lang === "en");
      document.getElementById("lang-tr").classList.toggle("active", lang === "tr");

      contentEl.style.opacity = "0";
      setTimeout(() => {
        applyTextContent();
        contentEl.style.opacity = "1";
      }, 120);
    }

    document.getElementById("lang-en").onclick = () => setLanguage("en");
    document.getElementById("lang-tr").onclick = () => setLanguage("tr");
    document.getElementById("prev-btn").onclick = () => selectLeaf(activeLeaf - 1);
    document.getElementById("next-btn").onclick = () => selectLeaf(activeLeaf + 1);

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") selectLeaf(activeLeaf + 1);
      if (e.key === "ArrowLeft") selectLeaf(activeLeaf - 1);
    });

    // =========================================================================
    // MODIFIED & ANIMATED ARTWORK CANVAS (USES CELIL'S 4 UPLOADED IMAGES)
    // =========================================================================
    const artCanvas = document.getElementById("artwork-canvas");
    const actx = artCanvas.getContext("2d");

    function drawCoverImage(ctx2d, img, cw, ch, offsetX, offsetY, scaleMul) {
      if (!img || !img.complete || !img.naturalWidth) return;
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;
      const scale = Math.max(cw / iw, ch / ih) * (scaleMul || 1.04);
      const dw = iw * scale;
      const dh = ih * scale;
      const dx = (cw - dw) * 0.5 + (offsetX || 0);
      const dy = (ch - dh) * 0.5 + (offsetY || 0);
      ctx2d.drawImage(img, dx, dy, dw, dh);
    }

    function drawButterflyOverlay(ctx2d, x, y, scale, wingPhase, angle, colorFill, colorStroke) {
      const flap = 0.22 + Math.abs(Math.sin(wingPhase)) * 0.85;
      ctx2d.save();
      ctx2d.translate(x, y);
      ctx2d.rotate(angle);
      ctx2d.scale(scale, scale);

      ctx2d.fillStyle = colorFill || "rgba(242, 210, 140, 0.78)";
      ctx2d.strokeStyle = colorStroke || "#8F2D1E";
      ctx2d.lineWidth = 1.6;

      [-1, 1].forEach((dir) => {
        ctx2d.beginPath();
        ctx2d.moveTo(0, 0);
        ctx2d.bezierCurveTo(dir * 16 * flap, -15, dir * 19 * flap, 1, 0, 5);
        ctx2d.fill();
        ctx2d.stroke();

        ctx2d.beginPath();
        ctx2d.moveTo(0, 3);
        ctx2d.bezierCurveTo(dir * 12 * flap, 6, dir * 10 * flap, 14, 0, 10);
        ctx2d.fill();
        ctx2d.stroke();
      });

      ctx2d.strokeStyle = "#181615";
      ctx2d.lineWidth = 1.5;
      ctx2d.beginPath();
      ctx2d.moveTo(0, -4);
      ctx2d.lineTo(0, 11);
      ctx2d.stroke();
      ctx2d.restore();
    }

    function renderModifiedArtwork(t) {
      const cw = artCanvas.width;
      const ch = artCanvas.height;
      actx.clearRect(0, 0, cw, ch);

      const key = LEAVES_DATA[activeLeaf].imgKey;
      const img = loadedImgs[key];

      actx.save();

      if (key === "monet") {
        // 1. MONET'S GARDEN + GOLDEN SUNBEAMS + FLUTTERING BUTTERFLIES
        const panX = Math.sin(t * 0.55) * 6;
        const panY = Math.cos(t * 0.45) * 4;
        actx.filter = "contrast(1.08) saturate(1.12) sepia(0.12)";
        drawCoverImage(actx, img, cw, ch, panX, panY, 1.06);
        actx.filter = "none";

        // Warm golden-hour diagonal sunbeams filtering through trees
        const sunGrad = actx.createLinearGradient(0, 0, cw * 0.85, ch);
        const sunPulse = 0.16 + Math.sin(t * 1.3) * 0.06;
        sunGrad.addColorStop(0, `rgba(255, 224, 150, ${sunPulse})`);
        sunGrad.addColorStop(0.5, "rgba(255, 210, 130, 0.05)");
        sunGrad.addColorStop(1, "rgba(24, 22, 21, 0.22)");
        actx.fillStyle = sunGrad;
        actx.fillRect(0, 0, cw, ch);

        // 4 Animated Butterflies flying inside Monet's Garden
        const gardenButterflies = [
          { x: cw * 0.28 + Math.sin(t * 1.1) * 48, y: ch * 0.62 + Math.cos(t * 1.6) * 24, s: 1.1, wp: t * 8.5, ang: -0.2 + Math.cos(t * 1.1) * 0.25 },
          { x: cw * 0.68 + Math.cos(t * 0.9) * 52, y: ch * 0.48 + Math.sin(t * 1.4) * 28, s: 0.95, wp: t * 9.2 + 1.4, ang: 0.18 + Math.sin(t * 0.9) * 0.2 },
          { x: cw * 0.48 + Math.sin(t * 1.4 + 2) * 60, y: ch * 0.34 + Math.cos(t * 1.1 + 1) * 20, s: 0.8, wp: t * 8.0 + 2.6, ang: -0.15 }
        ];
        gardenButterflies.forEach((b) => {
          drawButterflyOverlay(actx, b.x, b.y, b.s, b.wp, b.ang, "rgba(255, 226, 155, 0.85)", "#8F2D1E");
        });

      } else if (key === "cart") {
        // 2. SQUARE-WHEELED CART: JOLTING BUMP MOTION + PULSING GOLDEN HALO ON ROUND TIRES + DUST PUFFS
        const joltY = Math.abs(Math.sin(t * 6.5)) * 5.5;
        const joltRot = Math.sin(t * 6.5) * 0.008;

        actx.save();
        actx.translate(cw * 0.5, ch * 0.5);
        actx.rotate(joltRot);
        actx.translate(-cw * 0.5, -ch * 0.5);
        actx.filter = "sepia(0.22) contrast(1.08) saturate(0.95)";
        drawCoverImage(actx, img, cw, ch, 0, joltY - 3, 1.05);
        actx.filter = "none";
        actx.restore();

        // Pulsing golden spotlight over the round tires inside the wagon (center-top of cart)
        const tireGlow = 0.22 + Math.sin(t * 3.2) * 0.12;
        const radGrad = actx.createRadialGradient(cw * 0.48, ch * 0.36, 10, cw * 0.48, ch * 0.36, 115);
        radGrad.addColorStop(0, `rgba(255, 215, 110, ${tireGlow})`);
        radGrad.addColorStop(1, "rgba(255, 215, 110, 0)");
        actx.fillStyle = radGrad;
        actx.fillRect(0, 0, cw, ch);

        // Dust puffs kicking up under the two square wheels
        [cw * 0.34, cw * 0.62].forEach((wx, idx) => {
          for (let d = 0; d < 4; d++) {
            const prog = ((t * 1.8 + d * 0.25 + idx * 0.4) % 1);
            const dx = wx - prog * 28 + Math.sin(d * 2) * 6;
            const dy = ch * 0.78 - prog * 14;
            const dr = 5 + prog * 14;
            actx.beginPath();
            actx.arc(dx, dy, dr, 0, Math.PI * 2);
            actx.fillStyle = `rgba(185, 152, 112, ${(1 - prog) * 0.42})`;
            actx.fill();
          }
        });

      } else if (key === "finn") {
        // 3. ADVENTURE TIME (FINN & JAKE): WARM BREATHING + SWORD SHIMMER + FLOATING FLOWER SPORES
        const zoom = 1.04 + Math.sin(t * 1.1) * 0.02;
        actx.filter = "contrast(1.06) saturate(1.08) sepia(0.10)";
        drawCoverImage(actx, img, cw, ch, Math.sin(t * 0.7) * 4, 0, zoom);
        actx.filter = "none";

        // Warm golden sunset vignette
        const warmGrad = actx.createRadialGradient(cw * 0.5, ch * 0.45, 40, cw * 0.5, ch * 0.5, cw * 0.65);
        warmGrad.addColorStop(0, "rgba(255, 235, 180, 0.08)");
        warmGrad.addColorStop(1, "rgba(143, 45, 30, 0.22)");
        actx.fillStyle = warmGrad;
        actx.fillRect(0, 0, cw, ch);

        // Floating golden-crimson flower petals & glowing spores across Finn & Jake
        for (let i = 0; i < 12; i++) {
          const prog = (t * 0.22 + i * 0.083) % 1;
          const px = (cw * ((i * 0.19 + Math.sin(t + i) * 0.06) % 1));
          const py = ch * (1.05 - prog * 1.1);
          const pr = 2.5 + (i % 3) * 1.4;
          actx.beginPath();
          actx.arc(px, py, pr, 0, Math.PI * 2);
          actx.fillStyle = i % 2 === 0 ? "rgba(255, 225, 130, 0.82)" : "rgba(215, 75, 55, 0.72)";
          actx.fill();
        }

      } else if (key === "happiness") {
        // 4. STEVE CUTTS' HAPPINESS: FLICKERING MARQUEE LIGHTBOX + CINEMATIC RAIN + SPOTLIGHT ON FOREGROUND MOUSE
        actx.filter = "contrast(1.14) saturate(0.95) sepia(0.14)";
        drawCoverImage(actx, img, cw, ch, Math.sin(t * 0.5) * 3, 0, 1.04);
        actx.filter = "none";

        // Neon Marquee flicker over "HAPPINESS / SOLD OUT" sign at top center
        const flicker = (Math.sin(t * 14) > -0.65 ? 0.22 : 0.04) + Math.sin(t * 3) * 0.06;
        const marqueeGrad = actx.createRadialGradient(cw * 0.48, ch * 0.2, 10, cw * 0.48, ch * 0.2, 150);
        marqueeGrad.addColorStop(0, `rgba(255, 240, 185, ${flicker})`);
        marqueeGrad.addColorStop(1, "rgba(18, 16, 15, 0.28)");
        actx.fillStyle = marqueeGrad;
        actx.fillRect(0, 0, cw, ch);

        // Diagonal atmospheric rain streaks
        actx.strokeStyle = "rgba(242, 236, 225, 0.32)";
        actx.lineWidth = 1.15;
        for (let r = 0; r < 22; r++) {
          const rx = ((r * 37 + t * 140) % (cw + 60)) - 30;
          const ry = ((r * 53 + t * 260) % (ch + 40)) - 20;
          actx.beginPath();
          actx.moveTo(rx, ry);
          actx.lineTo(rx - 7, ry + 16);
          actx.stroke();
        }

      } else {
        // 5. SAADI SHIRAZI: BESPOKE PERSIAN ILLUMINATED CALLIGRAPHY & SILK BLADE TABLEAU
        actx.fillStyle = "#1B1615";
        actx.fillRect(0, 0, cw, ch);

        // Golden geometric manuscript border
        actx.strokeStyle = "rgba(212, 184, 134, 0.42)";
        actx.lineWidth = 1.5;
        actx.strokeRect(14, 14, cw - 28, ch - 28);

        // Concentric crimson & gold ink ripples
        const cx = cw * 0.5;
        const cy = ch * 0.54;
        for (let k = 0; k < 4; k++) {
          const r = ((t * 28 + k * 34) % 135);
          const alpha = Math.max(0, (1 - r / 135) * 0.65);
          actx.strokeStyle = k % 2 === 0 ? "#8F2D1E" : "#D4B886";
          actx.globalAlpha = alpha;
          actx.lineWidth = 1.8;
          actx.beginPath();
          actx.ellipse(cx, cy, r, r * 0.46, 0, 0, Math.PI * 2);
          actx.stroke();
        }

        // Diagonal calligraphy reed pen & silk cut line
        actx.globalAlpha = 0.92;
        actx.strokeStyle = "#F2ECE1";
        actx.lineWidth = 2.2;
        const sweep = Math.sin(t * 1.8) * 18;
        actx.beginPath();
        actx.moveTo(cw * 0.22, ch * 0.72);
        actx.quadraticCurveTo(cw * 0.5, ch * 0.28 + sweep, cw * 0.78, ch * 0.32);
        actx.stroke();

        // Falling crimson ink drop
        const dropY = 35 + ((t * 55) % (cy - 35));
        actx.fillStyle = "#8F2D1E";
        actx.beginPath();
        actx.arc(cx, dropY, 4.5, 0, Math.PI * 2);
        actx.fill();
      }

      // Unified Bespoke Atelier Inner Frame Border
      actx.strokeStyle = "rgba(143, 45, 30, 0.28)";
      actx.lineWidth = 2;
      actx.strokeRect(1, 1, cw - 2, ch - 2);
      actx.restore();
    }

    // =========================================================================
    // LIVING BOTANICAL SAPLING CANVAS (RIGHT SIDE OF STAGE)
    // =========================================================================
    const canvas = document.getElementById("sapling-canvas");
    const stageEl = document.getElementById("bespoke-stage");
    const ctx = canvas.getContext("2d");

    let mouse = { x: 0.75, y: 0.5 };
    let time = 0;
    let leafHitboxes = [];
    let ripples = [];
    let lastW = 0, lastH = 0;

    stageEl.addEventListener("mousemove", (e) => {
      const r = stageEl.getBoundingClientRect();
      mouse.x = (e.clientX - r.left) / (r.width || 1);
      mouse.y = (e.clientY - r.top) / (r.height || 1);

      const mx = e.clientX - r.left;
      const my = e.clientY - r.top;
      let overLeaf = false;
      for (const hb of leafHitboxes) {
        if (Math.hypot(mx - hb.x, my - hb.y) < hb.r) {
          overLeaf = true;
          break;
        }
      }
      canvas.style.cursor = overLeaf ? "pointer" : "default";
    });

    canvas.addEventListener("click", (e) => {
      const r = stageEl.getBoundingClientRect();
      const mx = e.clientX - r.left;
      const my = e.clientY - r.top;
      for (const hb of leafHitboxes) {
        if (Math.hypot(mx - hb.x, my - hb.y) < hb.r) {
          selectLeaf(hb.index, { x: hb.x, y: hb.y });
          return;
        }
      }
    });

    function drawBotanicalLeaf(cx, cy, angle, length, width, isSelected, numeral) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      const ACCENT = "#8F2D1E";
      const INK = "#181615";
      const BG = "#F2ECE1";

      ctx.strokeStyle = ACCENT;
      ctx.globalAlpha = isSelected ? 0.95 : 0.68;
      ctx.lineWidth = isSelected ? 2.1 : 1.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(length * 0.1, -2, length * 0.2, 0);
      ctx.stroke();

      const bladeStart = length * 0.18;
      const bladeEnd = length;
      const bladeLen = bladeEnd - bladeStart;

      ctx.beginPath();
      ctx.moveTo(bladeStart, 0);
      ctx.bezierCurveTo(
        bladeStart + bladeLen * 0.28, -width * 1.15,
        bladeStart + bladeLen * 0.72, -width * 0.85,
        bladeEnd, 0
      );
      ctx.bezierCurveTo(
        bladeStart + bladeLen * 0.72, width * 0.85,
        bladeStart + bladeLen * 0.28, width * 1.15,
        bladeStart, 0
      );
      ctx.closePath();

      ctx.fillStyle = isSelected ? ACCENT : "rgba(143, 45, 30, 0.13)";
      ctx.globalAlpha = isSelected ? 0.24 : 0.95;
      ctx.fill();

      ctx.strokeStyle = ACCENT;
      ctx.globalAlpha = isSelected ? 1.0 : 0.68;
      ctx.lineWidth = isSelected ? 2.0 : 1.25;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(bladeStart, 0);
      ctx.quadraticCurveTo(bladeStart + bladeLen * 0.5, -width * 0.05, bladeEnd - 2, 0);
      ctx.strokeStyle = ACCENT;
      ctx.globalAlpha = isSelected ? 0.95 : 0.55;
      ctx.lineWidth = isSelected ? 1.4 : 0.95;
      ctx.stroke();

      const veinPairs = 4;
      for (let v = 1; v <= veinPairs; v++) {
        const frac = v / (veinPairs + 1);
        const vx = bladeStart + bladeLen * frac;
        const vw = width * Math.sin(frac * Math.PI) * 0.78;

        ctx.beginPath();
        ctx.moveTo(vx, 0);
        ctx.quadraticCurveTo(vx + bladeLen * 0.08, -vw * 0.5, vx + bladeLen * 0.16, -vw * 0.85);
        ctx.moveTo(vx, 0);
        ctx.quadraticCurveTo(vx + bladeLen * 0.08, vw * 0.5, vx + bladeLen * 0.16, vw * 0.85);
        ctx.strokeStyle = ACCENT;
        ctx.globalAlpha = isSelected ? 0.65 : 0.35;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }

      const midX = bladeStart + bladeLen * 0.52;
      ctx.restore();

      const worldX = cx + Math.cos(angle) * midX;
      const worldY = cy + Math.sin(angle) * midX;

      ctx.save();
      ctx.beginPath();
      ctx.arc(worldX, worldY, isSelected ? 13 : 10.5, 0, Math.PI * 2);
      ctx.fillStyle = isSelected ? ACCENT : BG;
      ctx.globalAlpha = isSelected ? 1 : 0.92;
      ctx.fill();
      ctx.lineWidth = 1.1;
      ctx.strokeStyle = ACCENT;
      ctx.stroke();

      ctx.fillStyle = isSelected ? BG : INK;
      ctx.globalAlpha = 1;
      ctx.font = `${isSelected ? "600" : "500"} 10.5px 'Cormorant Garamond', Georgia, serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(numeral, worldX, worldY + 0.5);
      ctx.restore();

      return { x: worldX, y: worldY, r: Math.max(length * 0.55, 28) };
    }

    function animate() {
      time += 0.016;

      renderModifiedArtwork(time);

      const w = stageEl.clientWidth || 750;
      const h = stageEl.clientHeight || 485;

      if (w !== lastW || h !== lastH) {
        lastW = w;
        lastH = h;
        canvas.width = w;
        canvas.height = h;
      }

      ctx.clearRect(0, 0, w, h);

      const ACCENT = "#8F2D1E";
      const INK = "#181615";

      const isMobile = w < 700;
      const baseX = isMobile ? w * 0.82 : w * 0.81;
      const soilY = h * 0.79;
      const wind = (mouse.x - 0.5) * 18 + Math.sin(time * 1.15) * 4.2;

      leafHitboxes = [];

      // 1. SOIL HORIZON
      ctx.save();
      ctx.strokeStyle = ACCENT;
      ctx.globalAlpha = 0.36;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(baseX - 115, soilY);
      ctx.quadraticCurveTo(baseX, soilY - 9, baseX + 115, soilY);
      ctx.stroke();

      ctx.globalAlpha = 0.2;
      for (let i = -88; i <= 88; i += 12) {
        const dotY = soilY + Math.sin(i * 0.12) * 3 + 5;
        ctx.beginPath();
        ctx.arc(baseX + i, dotY, 1.2, 0, Math.PI * 2);
        ctx.fillStyle = ACCENT;
        ctx.fill();
      }
      ctx.restore();

      // 2. UNDERGROUND ROOTS
      const roots = [
        { endX: -68, endY: 62, ctrlX: -20, ctrlY: 32, w: 1.7, sub: [-88, 76] },
        { endX: -32, endY: 76, ctrlX: -12, ctrlY: 44, w: 1.4, sub: [-44, 90] },
        { endX: 4,   endY: 86, ctrlX: 3,   ctrlY: 48, w: 2.3, sub: [-8, 98] },
        { endX: 40,  endY: 72, ctrlX: 16,  ctrlY: 40, w: 1.5, sub: [58, 86] },
        { endX: 74,  endY: 56, ctrlX: 28,  ctrlY: 26, w: 1.3, sub: [90, 68] }
      ];

      ctx.save();
      ctx.strokeStyle = ACCENT;
      roots.forEach((rt) => {
        ctx.globalAlpha = 0.32;
        ctx.lineWidth = rt.w;
        ctx.beginPath();
        ctx.moveTo(baseX, soilY);
        ctx.quadraticCurveTo(baseX + rt.ctrlX, soilY + rt.ctrlY, baseX + rt.endX, soilY + rt.endY);
        ctx.stroke();

        ctx.globalAlpha = 0.18;
        ctx.lineWidth = 0.85;
        ctx.beginPath();
        ctx.moveTo(baseX + rt.endX * 0.65, soilY + rt.endY * 0.65);
        ctx.lineTo(baseX + rt.sub[0], soilY + rt.sub[1]);
        ctx.stroke();
      });
      ctx.restore();

      // 3. COTYLEDONS
      drawBotanicalLeaf(baseX - 2, soilY - 12, Math.PI * 1.12, 28, 6.5, false, "·");
      drawBotanicalLeaf(baseX + 2, soilY - 12, -Math.PI * 0.12, 28, 6.5, false, "·");

      // 4. MAIN TAPERING SAPLING STEM
      const topX = baseX + wind;
      const topY = h * 0.15;
      const ctrl1X = baseX - 16 + wind * 0.25;
      const ctrl1Y = soilY - (soilY - topY) * 0.35;
      const ctrl2X = baseX + 13 + wind * 0.65;
      const ctrl2Y = soilY - (soilY - topY) * 0.70;

      function stemPoint(t) {
        const u = 1 - t;
        const tt = t * t, uu = u * u;
        const uuu = uu * u, ttt = tt * t;
        const x = uuu * baseX + 3 * uu * t * ctrl1X + 3 * u * tt * ctrl2X + ttt * topX;
        const y = uuu * soilY + 3 * uu * t * ctrl1Y + 3 * u * tt * ctrl2Y + ttt * topY;
        return { x, y };
      }

      ctx.save();
      const segments = 32;
      for (let i = 0; i < segments; i++) {
        const t0 = i / segments;
        const t1 = (i + 1) / segments;
        const p0 = stemPoint(t0);
        const p1 = stemPoint(t1);
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.strokeStyle = ACCENT;
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = 4.3 * (1 - t0 * 0.68);
        ctx.lineCap = "round";
        ctx.stroke();
      }
      ctx.restore();

      // 5. FIVE VEINED LEAVES (I - V)
      const branchNodes = [
        { t: 0.24, side: -1, len: 68, width: 18, baseAngle: -Math.PI * 0.76, numeral: "I" },
        { t: 0.41, side:  1, len: 72, width: 19, baseAngle: -Math.PI * 0.20, numeral: "II" },
        { t: 0.58, side: -1, len: 66, width: 18, baseAngle: -Math.PI * 0.74, numeral: "III" },
        { t: 0.74, side:  1, len: 62, width: 17, baseAngle: -Math.PI * 0.22, numeral: "IV" },
        { t: 0.89, side: -1, len: 54, width: 15, baseAngle: -Math.PI * 0.70, numeral: "V" }
      ];

      branchNodes.forEach((b, idx) => {
        const node = stemPoint(b.t);
        const swayAngle = b.baseAngle + Math.sin(time * 1.4 + idx) * 0.045 + (wind * 0.003);

        const shootX = node.x + b.side * 17;
        const shootY = node.y - 10;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(node.x, node.y);
        ctx.quadraticCurveTo(node.x + b.side * 8, node.y - 7, shootX, shootY);
        ctx.strokeStyle = ACCENT;
        ctx.globalAlpha = 0.78;
        ctx.lineWidth = 2.0;
        ctx.stroke();
        ctx.restore();

        const isSel = (idx === activeLeaf);
        const hb = drawBotanicalLeaf(shootX, shootY, swayAngle, b.len, b.width, isSel, b.numeral);
        leafHitboxes.push({ x: hb.x, y: hb.y, r: hb.r, index: idx });
      });

      // 6. APICAL BUD
      const tip = stemPoint(1.0);
      ctx.save();
      ctx.translate(tip.x, tip.y);
      ctx.rotate((wind * 0.012));

      ctx.strokeStyle = ACCENT;
      ctx.fillStyle = "rgba(143, 45, 30, 0.22)";
      ctx.lineWidth = 1.4;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-13, -15, -9, -32, -2, -39);
      ctx.bezierCurveTo(3, -27, 3, -13, 0, 0);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(13, -13, 11, -28, 4, -34);
      ctx.bezierCurveTo(-1, -23, -1, -11, 0, 0);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(1, -44, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = ACCENT;
      ctx.globalAlpha = 0.65 + Math.sin(time * 2.5) * 0.3;
      ctx.fill();
      ctx.restore();

      // 7. CLICK RIPPLES
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += 1.4;
        rp.alpha *= 0.93;
        ctx.save();
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.strokeStyle = ACCENT;
        ctx.globalAlpha = rp.alpha;
        ctx.lineWidth = 1.3;
        ctx.stroke();
        ctx.restore();
        if (rp.alpha < 0.03) ripples.splice(i, 1);
      }

      ctx.save();
      ctx.fillStyle = INK;
      ctx.globalAlpha = 0.42;
      ctx.font = "italic 11px 'Cormorant Garamond', Georgia, serif";
      ctx.textAlign = "right";
      ctx.fillText(UI_TEXT[currentLang].sealCaption, baseX + 105, soilY + 24);
      ctx.restore();

      requestAnimationFrame(animate);
    }

    renderPills();
    applyTextContent();
    animate();
  </script>
</body>
</html>
