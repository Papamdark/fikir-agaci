<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Celil’s Idea Tree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-velvet: #0B0A0E;
      --gold: #E5C178;
      --crimson: #B83A2D;
      --ivory: #F4EFE6;
      --ivory-muted: rgba(244, 239, 230, 0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-velvet);
      color: var(--ivory);
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #museum-stage {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0B0A0E;
    }

    /* UNIFIED FULL-STAGE LIVING PAINTING CANVAS (TREE + FEATHERED OIL VISION + PARTICLES) */
    #museum-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* MINIMALIST FLOATING TOP BAR */
    .museum-topbar {
      position: absolute;
      top: 1.4rem;
      left: 2.4rem;
      right: 2.4rem;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .museum-signature {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
    }

    .sig-diamond {
      width: 7px;
      height: 7px;
      transform: rotate(45deg);
      background: var(--gold);
      box-shadow: 0 0 12px var(--gold);
    }

    .sig-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ivory);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }

    .lang-toggle {
      pointer-events: auto;
      display: inline-flex;
      border: 1px solid rgba(229, 193, 120, 0.28);
      border-radius: 999px;
      background: rgba(11, 10, 14, 0.65);
      backdrop-filter: blur(14px);
      overflow: hidden;
      padding: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--ivory-muted);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.1em;
      padding: 0.26rem 0.68rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .lang-btn.active {
      background: var(--gold);
      color: #0B0A0E;
    }

    /* LEFT-LOWER EDITORIAL TYPOGRAPHY (BLENDED DIRECTLY INTO THE PAINTED ATMOSPHERE) */
    .editorial-overlay {
      position: absolute;
      left: 2.6rem;
      bottom: 4.1rem;
      z-index: 6;
      max-width: 54%;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .leaf-eyebrow {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 1.08rem;
      color: var(--gold);
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
    }

    .quote-master {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.75rem, 2.9vw, 2.65rem);
      line-height: 1.12;
      color: var(--ivory);
      margin-bottom: 0.5rem;
      text-shadow:
        0 4px 24px rgba(0, 0, 0, 0.95),
        0 1px 3px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-wrap: wrap;
      gap: 0.22em;
    }

    .word-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
      padding-bottom: 0.05em;
    }

    .word-inner {
      display: inline-block;
      transform: translateY(108%);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.45s ease;
    }

    .word-inner.revealed {
      transform: translateY(0);
      opacity: 1;
    }

    .quote-source {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.04rem;
      color: var(--gold);
      opacity: 0.92;
      margin-bottom: 0.65rem;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
    }

    .quote-reflection {
      font-size: 0.83rem;
      line-height: 1.58;
      color: rgba(244, 239, 230, 0.86);
      padding-left: 0.9rem;
      border-left: 2px solid var(--gold);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
      max-width: 540px;
    }

    /* BOTTOM NAVIGATION BAR */
    .museum-footer {
      position: absolute;
      bottom: 1.1rem;
      left: 2.6rem;
      right: 2.4rem;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .branch-pills-bar {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.28rem 0.45rem;
      border-radius: 999px;
      background: rgba(11, 10, 14, 0.68);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(229, 193, 120, 0.24);
    }

    .nav-step-btn {
      background: transparent;
      border: none;
      color: var(--gold);
      font-size: 12px;
      padding: 0.25rem 0.6rem;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s ease;
    }

    .nav-step-btn:hover {
      opacity: 1;
    }

    .roman-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--ivory-muted);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .roman-btn:hover {
      color: var(--ivory);
      border-color: rgba(229, 193, 120, 0.35);
    }

    .roman-btn.active {
      background: var(--gold);
      color: #0B0A0E;
      box-shadow: 0 0 14px rgba(229, 193, 120, 0.5);
    }

    .footer-whisper {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 13.5px;
      color: rgba(229, 193, 120, 0.78);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    @media (max-width: 780px) {
      .museum-topbar {
        top: 0.9rem;
        left: 1.1rem;
        right: 1.1rem;
      }
      .sig-text {
        font-size: 11.5px;
        letter-spacing: 0.2em;
      }
      .editorial-overlay {
        left: 1.1rem;
        right: 1.1rem;
        bottom: 3.9rem;
        max-width: 100%;
      }
      .quote-master {
        font-size: 1.48rem;
      }
      .quote-reflection {
        font-size: 0.77rem;
        line-height: 1.48;
      }
      .museum-footer {
        bottom: 0.85rem;
        left: 1.1rem;
        right: 1.1rem;
        justify-content: center;
      }
      .footer-whisper {
        display: none;
      }
    }
  </style>
</head>
<body>

  <main id="museum-stage">
    <canvas id="museum-canvas"></canvas>

    <header class="museum-topbar">
      <div class="museum-signature">
        <span class="sig-diamond"></span>
        <span class="sig-text" id="brand-title">CELIL’S IDEA TREE</span>
      </div>

      <div class="lang-toggle" role="group" aria-label="Language Switch">
        <button type="button" class="lang-btn active" id="lang-en">EN</button>
        <button type="button" class="lang-btn" id="lang-tr">TR</button>
      </div>
    </header>

    <article class="editorial-overlay" id="editorial-overlay">
      <div class="leaf-eyebrow" id="leaf-tag">Branch I · Gulistan Rose Miniature</div>
      <h1 class="quote-master" id="quote-heading"></h1>
      <div class="quote-source" id="quote-author"></div>
      <p class="quote-reflection" id="quote-root"></p>
    </article>

    <footer class="museum-footer">
      <div class="branch-pills-bar">
        <button type="button" class="nav-step-btn" id="prev-btn" title="Previous Branch">←</button>
        <div id="roman-pills" style="display:flex; gap:0.2rem;"></div>
        <button type="button" class="nav-step-btn" id="next-btn" title="Next Branch">→</button>
      </div>

      <div class="footer-whisper" id="footer-hint">
        Touch the glowing medallions (I – V) on the Tree of Ideas to awaken each painting
      </div>
    </footer>
  </main>

    let currentLang = "en";

    let prevLeaf = 0;
    let visionCrossfade = 1.0;

    const pillsEl = document.getElementById("roman-pills");
    const overlayEl = document.getElementById("editorial-overlay");

    function renderPills() {
      pillsEl.innerHTML = "";
      LEAVES_DATA.forEach((item, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "roman-btn" + (idx === activeLeaf ? " active" : "");
        b.textContent = item.num;
        b.onclick = () => selectLeaf(idx);
        pillsEl.appendChild(b);
      });
    }

    function animateWords(text) {
      const qEl = document.getElementById("quote-heading");
      qEl.innerHTML = "";
      text.split(" ").forEach((w, i) => {
        const m = document.createElement("span");
        m.className = "word-mask";
        const s = document.createElement("span");
        s.className = "word-inner";
        s.textContent = w;
        s.style.transitionDelay = `${i * 24}ms`;
        m.appendChild(s);
        qEl.appendChild(m);
      });
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          qEl.querySelectorAll(".word-inner").forEach((el) => el.classList.add("revealed"));
        });
      });
    }

    function updateEditorialText() {
      const ui = UI_TEXT[currentLang];
      const item = LEAVES_DATA[activeLeaf];
      const loc = item[currentLang];

      document.getElementById("brand-title").textContent = ui.brand;
      document.getElementById("leaf-tag").textContent = `${ui.branchWord} ${item.num} — ${item.title[currentLang]}`;
      document.getElementById("footer-hint").textContent = ui.hint;

      animateWords(loc.q);

      document.getElementById("quote-author").textContent = loc.a;
      document.getElementById("quote-root").textContent = loc.r;
    }

    function selectLeaf(idx, ripplePos) {
      const nextIdx = (idx + LEAVES_DATA.length) % LEAVES_DATA.length;
      if (nextIdx === activeLeaf && visionCrossfade >= 1) return;
      prevLeaf = activeLeaf;
      activeLeaf = nextIdx;
      visionCrossfade = 0.0;

      overlayEl.style.opacity = "0";
      overlayEl.style.transform = "translateY(8px)";
      setTimeout(() => {
        updateEditorialText();
        overlayEl.style.opacity = "1";
        overlayEl.style.transform = "translateY(0)";
      }, 150);

      renderPills();

      if (ripplePos) {
        ripples.push({ x: ripplePos.x, y: ripplePos.y, r: 8, alpha: 1.0 });
      } else if (branchNodesScreen[activeLeaf]) {
        ripples.push({ x: branchNodesScreen[activeLeaf].x, y: branchNodesScreen[activeLeaf].y, r: 8, alpha: 0.9 });
      }
    }

    function setLanguage(lang) {
      if (lang === currentLang) return;
      currentLang = lang;
      document.documentElement.lang = lang;
      document.getElementById("lang-en").classList.toggle("active", lang === "en");
      document.getElementById("lang-tr").classList.toggle("active", lang === "tr");
      updateEditorialText();
    }

    document.getElementById("lang-en").onclick = () => setLanguage("en");
    document.getElementById("lang-tr").onclick = () => setLanguage("tr");
    document.getElementById("prev-btn").onclick = () => selectLeaf(activeLeaf - 1);
    document.getElementById("next-btn").onclick = () => selectLeaf(activeLeaf + 1);

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") selectLeaf(activeLeaf + 1);
      if (e.key === "ArrowLeft") selectLeaf(activeLeaf - 1);
    });

    let lastWheel = 0;
    window.addEventListener("wheel", (e) => {
      const now = performance.now();
      if (now - lastWheel < 750) return;
      if (Math.abs(e.deltaY) > 25) {
        lastWheel = now;
        selectLeaf(activeLeaf + (e.deltaY > 0 ? 1 : -1));
      }
    }, { passive: true });

    const canvas = document.getElementById("museum-canvas");
    const stageEl = document.getElementById("museum-stage");
    const ctx = canvas.getContext("2d");

    // Offscreen canvas for feather-masking the oil paintings without any box edges
    const visionBuffer = document.createElement("canvas");
    visionBuffer.width = 680;
    visionBuffer.height = 440;
    const vctx = visionBuffer.getContext("2d");

    let time = 0;
    let mouse = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5 };
    let lastW = 0, lastH = 0;
    let branchNodesScreen = [];
    let ripples = [];

    // 90 Golden Pollen & Firefly Spores drifting between the Tree and the Painting
    const spores = Array.from({ length: 85 }, (_, i) => ({
      x: Math.random(),
      y: Math.random(),
      vx: (Math.random() - 0.5) * 0.0004,
      vy: -0.0003 - Math.random() * 0.0005,
      r: 1.0 + Math.random() * 2.1,
      phase: Math.random() * Math.PI * 2
    }));

    stageEl.addEventListener("mousemove", (e) => {
      const r = stageEl.getBoundingClientRect();
      mouse.tx = (e.clientX - r.left) / (r.width || 1);
      mouse.ty = (e.clientY - r.top) / (r.height || 1);

      const mx = e.clientX - r.left;
      const my = e.clientY - r.top;
      let over = false;
      for (const nd of branchNodesScreen) {
        if (Math.hypot(mx - nd.x, my - nd.y) < nd.r) {
          over = true;
          break;
        }
      }
      canvas.style.cursor = over ? "pointer" : "default";
    });

    function handleStageTap(clientX, clientY) {
      const r = stageEl.getBoundingClientRect();
      const mx = clientX - r.left;
      const my = clientY - r.top;
      for (const nd of branchNodesScreen) {
        if (Math.hypot(mx - nd.x, my - nd.y) < nd.r) {
          selectLeaf(nd.index, { x: nd.x, y: nd.y });
          return true;
        }
      }
      return false;
    }

    canvas.addEventListener("click", (e) => handleStageTap(e.clientX, e.clientY));
    canvas.addEventListener("touchstart", (e) => {
      if (e.touches && e.touches.length > 0) {
        if (handleStageTap(e.touches[0].clientX, e.touches[0].clientY)) {
          e.preventDefault();
        }
      }
    }, { passive: false });

    function drawButterfly(ctx2d, x, y, scale, wingPhase, angle) {
      const flap = 0.22 + Math.abs(Math.sin(wingPhase)) * 0.85;
      ctx2d.save();
      ctx2d.translate(x, y);
      ctx2d.rotate(angle);
      ctx2d.scale(scale, scale);

      ctx2d.fillStyle = "rgba(245, 210, 135, 0.86)";
      ctx2d.strokeStyle = "#8F2D1E";
      ctx2d.lineWidth = 1.4;

      [-1, 1].forEach((dir) => {
        ctx2d.beginPath();
        ctx2d.moveTo(0, 0);
        ctx2d.bezierCurveTo(dir * 15 * flap, -14, dir * 18 * flap, 1, 0, 5);
        ctx2d.fill();
        ctx2d.stroke();

        ctx2d.beginPath();
        ctx2d.moveTo(0, 3);
        ctx2d.bezierCurveTo(dir * 11 * flap, 6, dir * 9 * flap, 13, 0, 9);
        ctx2d.fill();
        ctx2d.stroke();
      });
      ctx2d.restore();
    }

    function renderFeatheredVisionToBuffer(imgKey, alpha, t) {
      const bw = visionBuffer.width;
      const bh = visionBuffer.height;
      vctx.clearRect(0, 0, bw, bh);

      const im = imgs[imgKey];
      if (!im || !im.complete || !im.naturalWidth) return;

      vctx.save();
      // Subtle slow Ken Burns breathing motion inside the oil vision
      const scale = Math.max(bw / im.naturalWidth, bh / im.naturalHeight) * (1.04 + Math.sin(t * 0.5) * 0.02);
      const dw = im.naturalWidth * scale;
      const dh = im.naturalHeight * scale;
      const focusY = imgKey === "saadi" ? 0.54 : 0.5;
      const dx = (bw - dw) * 0.5 + (mouse.x - 0.5) * -14;
      const dy = (bh - dh) * focusY + (mouse.y - 0.5) * -10;

      vctx.drawImage(im, dx, dy, dw, dh);

      // Scene-specific living animation inside the oil painting
      if (imgKey === "saadi") {
        // Drifting Gulistan rose blossoms
        for (let p = 0; p < 14; p++) {
          const prog = (t * 0.14 + p * 0.071) % 1;
          const px = bw * (0.18 + ((p * 0.17) % 0.65)) + Math.sin(t * 1.4 + p) * 18;
          const py = prog * bh;
          vctx.save();
          vctx.translate(px, py);
          vctx.rotate(t * 1.5 + p);
          vctx.beginPath();
          vctx.ellipse(0, 0, 4.5, 2.5, 0, 0, Math.PI * 2);
          vctx.fillStyle = p % 2 === 0 ? "rgba(255, 240, 225, 0.85)" : "rgba(235, 155, 150, 0.82)";
          vctx.fill();
          vctx.restore();
        }
      } else if (imgKey === "monet" || imgKey === "finn") {
        // Fluttering golden butterflies over Monet's garden / Finn & Jake's meadow
        for (let b = 0; b < 3; b++) {
          const bx = bw * (0.28 + b * 0.22) + Math.sin(t * 1.1 + b * 2) * 45;
          const by = bh * (0.55 - b * 0.1) + Math.cos(t * 1.5 + b) * 24;
          drawButterfly(vctx, bx, by, 0.95 - b * 0.12, t * 8.2 + b, Math.cos(t + b) * 0.2);
        }
      } else if (imgKey === "mizen") {
        // Expanding golden lotus water ripples around the source stone
        for (let r = 0; r < 3; r++) {
          const prog = ((t * 0.45 + r * 0.33) % 1);
          const rx = bw * 0.52;
          const ry = bh * 0.64;
          vctx.beginPath();
          vctx.ellipse(rx, ry, prog * 140, prog * 36, 0, 0, Math.PI * 2);
          vctx.strokeStyle = `rgba(229, 193, 120, ${(1 - prog) * 0.55})`;
          vctx.lineWidth = 1.6;
          vctx.stroke();
        }
      } else if (imgKey === "rota") {
        // Gentle rain on the left crowd + warm golden sun-rays through the right archway
        vctx.strokeStyle = "rgba(244, 239, 230, 0.25)";
        vctx.lineWidth = 1.1;
        for (let r = 0; r < 16; r++) {
          const rx = ((r * 29 + t * 90) % (bw * 0.48));
          const ry = ((r * 47 + t * 240) % bh);
          vctx.beginPath();
          vctx.moveTo(rx, ry);
          vctx.lineTo(rx - 5, ry + 15);
          vctx.stroke();
        }
      }

      // MULTI-STOP RADIAL FEATHER MASK (Dissolves all 4 edges into the Tree's dark-velvet canvas!)
      vctx.globalCompositeOperation = "destination-in";
      const maskGrad = vctx.createRadialGradient(
        bw * 0.5, bh * 0.48, Math.min(bw, bh) * 0.18,
        bw * 0.5, bh * 0.48, Math.max(bw, bh) * 0.52
      );
      maskGrad.addColorStop(0.0, `rgba(0, 0, 0, ${alpha})`);
      maskGrad.addColorStop(0.55, `rgba(0, 0, 0, ${alpha * 0.88})`);
      maskGrad.addColorStop(0.82, `rgba(0, 0, 0, ${alpha * 0.35})`);
      maskGrad.addColorStop(1.0, "rgba(0, 0, 0, 0)");
      vctx.fillStyle = maskGrad;
      vctx.fillRect(0, 0, bw, bh);

      vctx.restore();
    }

    function animate() {
      time += 0.016;
      mouse.x += (mouse.tx - mouse.x) * 0.06;
      mouse.y += (mouse.ty - mouse.y) * 0.06;
      if (visionCrossfade < 1.0) {
        visionCrossfade = Math.min(1.0, visionCrossfade + 0.045);
      }

      const w = stageEl.clientWidth || 800;
      const h = stageEl.clientHeight || 485;
      if (w !== lastW || h !== lastH) {
        lastW = w;
        lastH = h;
        canvas.width = w;
        canvas.height = h;
      }

      ctx.fillStyle = "#0B0A0E";
      ctx.fillRect(0, 0, w, h);

      const isMobile = w < 780;

      // 1. DRAW THE MASTERPIECE BOTANICAL TREE OF IDEAS (FULL STAGE FOUNDATION)
      const treeImg = imgs.tree;
      let treeRect = { x: 0, y: 0, w: w, h: h };
      if (treeImg && treeImg.complete && treeImg.naturalWidth) {
        const scale = Math.max(w / treeImg.naturalWidth, h / treeImg.naturalHeight) * 1.02;
        const tw = treeImg.naturalWidth * scale;
        const th = treeImg.naturalHeight * scale;
        // On mobile, shift the tree slightly so its trunk sits on the right half while visible
        const alignX = isMobile ? 0.82 : 0.65;
        const tx = (w - tw) * alignX + (mouse.x - 0.5) * -10;
        const ty = (h - th) * 0.5 + (mouse.y - 0.5) * -6;
        treeRect = { x: tx, y: ty, w: tw, h: th };

        ctx.save();
        ctx.drawImage(treeImg, tx, ty, tw, th);
        ctx.restore();
      }

      // 2. DRAW THE FEATHERED OIL PAINTING VISION EMERGING IN THE UPPER-LEFT ATMOSPHERE
      const activeItem = LEAVES_DATA[activeLeaf];
      renderFeatheredVisionToBuffer(activeItem.imgKey, visionCrossfade, time);

      const visW = isMobile ? w * 0.94 : Math.min(w * 0.58, 660);
      const visH = visW * (440 / 680);
      const visX = isMobile ? w * 0.03 : w * 0.025;
      const visY = isMobile ? h * 0.06 : h * 0.04;

      ctx.save();
      ctx.drawImage(visionBuffer, visX, visY, visW, visH);
      ctx.restore();

      // 3. COMPUTE & DRAW THE 5 GLOWING INTERACTIVE MEDALLIONS ON THE PAINTED TREE'S BRANCHES
      branchNodesScreen = [];
      LEAVES_DATA.forEach((lf, idx) => {
        const bx = treeRect.x + treeRect.w * lf.treeRelX;
        const by = treeRect.y + treeRect.h * lf.treeRelY;
        const isSel = (idx === activeLeaf);

        branchNodesScreen.push({ x: bx, y: by, r: 28, index: idx });

        // Golden energy thread connecting the active branch on the tree to the oil vision!
        if (isSel && !isMobile) {
          ctx.save();
          const targetVx = visX + visW * 0.72;
          const targetVy = visY + visH * 0.52;
          const gradLine = ctx.createLinearGradient(bx, by, targetVx, targetVy);
          gradLine.addColorStop(0, "rgba(229, 193, 120, 0.65)");
          gradLine.addColorStop(0.5, "rgba(184, 58, 45, 0.35)");
          gradLine.addColorStop(1, "rgba(229, 193, 120, 0)");

          ctx.strokeStyle = gradLine;
          ctx.lineWidth = 1.6;
          ctx.setLineDash([4, 6]);
          ctx.lineDashOffset = -time * 18;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.quadraticCurveTo((bx + targetVx) * 0.5, Math.min(by, targetVy) - 35, targetVx, targetVy);
          ctx.stroke();
          ctx.restore();
        }

        // Medallion Halo & Roman Numeral on the Tree Branch
        ctx.save();
        if (isSel) {
          const pulseR = 19 + Math.sin(time * 3.2) * 3.5;
          const halo = ctx.createRadialGradient(bx, by, 2, bx, by, pulseR * 1.7);
          halo.addColorStop(0, "rgba(229, 193, 120, 0.85)");
          halo.addColorStop(0.5, "rgba(184, 58, 45, 0.35)");
          halo.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(bx, by, pulseR * 1.7, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(bx, by, isSel ? 13 : 10.5, 0, Math.PI * 2);
        ctx.fillStyle = isSel ? "#E5C178" : "rgba(15, 13, 18, 0.84)";
        ctx.fill();
        ctx.lineWidth = 1.3;
        ctx.strokeStyle = "#E5C178";
        ctx.stroke();

        ctx.fillStyle = isSel ? "#0B0A0E" : "#F4EFE6";
        ctx.font = "600 11px 'Cormorant Garamond', Georgia, serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(lf.num, bx, by + 0.5);
        ctx.restore();
      });

      // 4. GOLDEN POLLEN SPORES DRIFTING ACROSS THE ENTIRE STAGE
      ctx.save();
      spores.forEach((sp) => {
        sp.x += sp.vx + Math.sin(time + sp.phase) * 0.0002;
        sp.y += sp.vy;
        if (sp.y < -0.05) { sp.y = 1.05; sp.x = Math.random(); }
        if (sp.x < 0) sp.x = 1;
        if (sp.x > 1) sp.x = 0;

        const sx = sp.x * w;
        const sy = sp.y * h;
        ctx.beginPath();
        ctx.arc(sx, sy, sp.r, 0, Math.PI * 2);
        ctx.fillStyle = "#E5C178";
        ctx.globalAlpha = 0.25 + Math.sin(time * 2.5 + sp.phase) * 0.2;
        ctx.fill();
      });
      ctx.restore();

      // 5. CLICK RIPPLES
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += 1.6;
        rp.alpha *= 0.92;
        ctx.save();
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.strokeStyle = "#E5C178";
        ctx.globalAlpha = rp.alpha;
        ctx.lineWidth = 1.4;
        ctx.stroke();
        ctx.restore();
        if (rp.alpha < 0.03) ripples.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }

    renderPills();
    updateEditorialText();
    animate();
  </script>
</body>
</html>
