<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celil’s Idea Tree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #F2ECE1;
      --paper-deep: #E8E0D1;
      --ink: #161514;
      --ink-muted: rgba(22, 21, 20, 0.58);
      --seal: #8F2D1E;
      --rule: rgba(22, 21, 20, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #exhibition {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      overflow: hidden;
    }

    /* TOP ARCHITECTURAL HEADER */
    .arch-header {
      height: 52px;
      padding: 0 1.8rem;
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .arch-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .seal-mark {
      width: 8px;
      height: 8px;
      background: var(--seal);
      display: inline-block;
    }

    .brand-title {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .edition-note {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 14px;
      color: var(--ink-muted);
    }

    .lang-box {
      display: inline-flex;
      border: 1px solid var(--rule);
    }

    .lang-btn {
      background: transparent;
      border: none;
      padding: 0.24rem 0.58rem;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--ink);
      color: var(--paper);
    }

    /* 5-LEAF UNFOLDING BYOBU / ACCORDION GALLERY */
    .accordion-stage {
      flex: 1;
      display: flex;
      width: 100%;
      overflow: hidden;
    }

    .leaf-panel {
      position: relative;
      height: 100%;
      border-right: 1px solid var(--rule);
      overflow: hidden;
      display: flex;
      transition: flex 0.72s cubic-bezier(0.22, 1, 0.36, 1),
                  background-color 0.4s ease;
      background: var(--paper);
      cursor: pointer;
    }

    .leaf-panel:last-child {
      border-right: none;
    }

    .leaf-panel.collapsed {
      flex: 0 0 58px;
      background: var(--paper-deep);
    }

    .leaf-panel.collapsed:hover {
      background: #E2D8C5;
    }

    .leaf-panel.expanded {
      flex: 1 1 auto;
      cursor: default;
      background: var(--paper);
    }

    /* COLLAPSED SPINE VIEW */
    .spine-column {
      width: 58px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.35rem 0;
      flex-shrink: 0;
      border-right: 1px solid transparent;
      transition: border-color 0.3s ease;
    }

    .leaf-panel.expanded .spine-column {
      border-right-color: var(--rule);
      background: rgba(22, 21, 20, 0.02);
    }

    .spine-roman {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 1.15rem;
      color: var(--ink);
      transition: color 0.3s ease;
    }

    .leaf-panel.expanded .spine-roman {
      color: var(--seal);
    }

    .spine-vertical-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .leaf-panel.expanded .spine-vertical-label {
      color: var(--ink);
      font-weight: 600;
    }

    .spine-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--rule);
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .leaf-panel.expanded .spine-dot {
      background: var(--seal);
      transform: scale(1.4);
    }

    /* EXPANDED SPREAD: EDITORIAL TEXT + ARCHITECTURAL ART PLATE */
    .spread-body {
      flex: 1;
      height: 100%;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease 0.15s;
      min-width: 520px;
    }

    .leaf-panel.expanded .spread-body {
      opacity: 1;
      pointer-events: auto;
    }

    .spread-editorial {
      padding: 2.2rem 2.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--rule);
    }

    .spread-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--seal);
    }

    .spread-quote-wrap {
      margin: auto 0;
    }

    .spread-quote {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.85rem, 2.8vw, 2.75rem);
      line-height: 1.13;
      color: var(--ink);
      margin-bottom: 0.9rem;
    }

    .spread-author {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.08rem;
      color: var(--ink-muted);
      margin-bottom: 1.35rem;
    }

    .spread-root {
      font-size: 0.85rem;
      line-height: 1.66;
      color: rgba(22, 21, 20, 0.82);
      padding-left: 1rem;
      border-left: 1.5px solid var(--seal);
    }

    .spread-bottom-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.8rem;
      border-top: 1px solid var(--rule);
      font-size: 11px;
      color: var(--ink-muted);
    }

    .step-link {
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--ink);
      padding: 0.3rem 0.75rem;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .step-link:hover {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    /* RIGHT COLUMN OF SPREAD: FULL-HEIGHT ARCHIVAL ART PLATE */
    .spread-art-plate {
      position: relative;
      height: 100%;
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: rgba(22, 21, 20, 0.018);
      overflow: hidden;
    }

    .art-image-well {
      position: relative;
      width: 100%;
      flex: 1;
      overflow: hidden;
      border: 1px solid rgba(22, 21, 20, 0.18);
      background: #1A1816;
    }

    .art-plate-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: sepia(0.12) contrast(1.04) saturate(0.94);
      transform: scale(1.03);
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                  filter 0.5s ease;
    }

    .art-image-well:hover .art-plate-img {
      transform: scale(1.07);
      filter: sepia(0) contrast(1.05) saturate(1.02);
    }

    /* Archival paper grain overlay */
    .art-image-well::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 28px rgba(22, 21, 20, 0.28);
    }

    .plate-caption-bar {
      padding-top: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    /* MOBILE PORTRAIT ACCORDION (VERTICAL STACKED UNFOLDING LEAVES) */
    @media (max-width: 820px) {
      #exhibition {
        height: auto;
        min-height: 100dvh;
        overflow-y: auto;
      }

      .arch-header {
        padding: 0 1.1rem;
      }

      .edition-note {
        display: none;
      }

      .accordion-stage {
        flex-direction: column;
        overflow: visible;
      }

      .leaf-panel {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--rule);
        flex-direction: column;
      }

      .leaf-panel.collapsed {
        flex: 0 0 48px;
      }

      .spine-column {
        width: 100%;
        height: 48px;
        flex-direction: row;
        padding: 0 1.1rem;
        border-right: none;
        border-bottom: 1px solid transparent;
      }

      .spine-vertical-label {
        writing-mode: horizontal-tb;
        transform: none;
        font-size: 10.5px;
      }

      .spread-body {
        min-width: 0;
        grid-template-columns: 1fr;
        display: none;
      }

      .leaf-panel.expanded .spread-body {
        display: grid;
      }

      .spread-editorial {
        padding: 1.35rem 1.15rem;
        border-right: none;
        border-bottom: 1px solid var(--rule);
        gap: 1rem;
      }

      .spread-art-plate {
        height: 240px;
        padding: 1rem 1.15rem;
      }
    }
  </style>
</head>
<body>

  <main id="exhibition">
    <header class="arch-header">
      <div class="arch-brand">
        <span class="seal-mark"></span>
        <span class="brand-title" id="brand-title">CELIL’S IDEA TREE</span>
      </div>

      <div class="header-right">
        <span class="edition-note" id="edition-note">Five Curated Leaves · Botanical & Philosophical Archive</span>
        <div class="lang-box" role="group" aria-label="Language Switch">
          <button type="button" class="lang-btn active" id="lang-en">EN</button>
          <button type="button" class="lang-btn" id="lang-tr">TR</button>
        </div>
      </div>
    </header>

    <section class="accordion-stage" id="accordion-stage"></section>
  </main>

  <script>
    const REAL_ART = __REAL_ART_JSON__;

    const UI_TEXT = {
      en: {
        brand: "CELIL’S IDEA TREE",
        edition: "Five Curated Leaves · Philosophical Archive",
        leafWord: "Leaf",
        prev: "← Prev",
        next: "Next Leaf →"
      },
      tr: {
        brand: "CELİL’İN FİKİR AĞACI",
        edition: "Beş Seçkin Yaprak · Düşünce Arşivi",
        leafWord: "Yaprak",
        prev: "← Önceki",
        next: "Sonraki Yaprak →"
      }
    };

    const LEAVES_DATA = [
      {
        num: "I",
        imgKey: "saadi",
        objPos: "center 52%",
        spine: { en: "Saadi Shirazi · Gulistan", tr: "Sadi Şirazî · Gülistan" },
        plate: { en: "Plate I — Gulistan Rose Garden Miniature (c. 1560)", tr: "Levha I — Gülistan Gül Bahçesi Minyatürü (16. Yüzyıl)" },
        en: {
          q: "“Wrong delivery is the executioner of a true word.”",
          a: "Saadi Shirazi — Gulistan (Chapter VIII)",
          r: "The truth of a statement does not depend on its tone; yet its ability to reach another human mind almost always does. The speaker is responsible for the grace of the delivery, and the listener for separating the essence from the vessel."
        },
        tr: {
          q: "“Yanlış üslup, doğru sözün celladıdır.”",
          a: "Sadi Şirazî — Gülistan (VIII. Bab)",
          r: "Doğrunun doğruluğu üsluba bağlı değildir; fakat insana ulaşabilmesi çoğu zaman üsluba bağlıdır. Söyleyen doğrunun üslubundan, dinleyen de doğrunun özünü üsluptan ayırabilmekten sorumludur."
        }
      },
      {
        num: "II",
        imgKey: "monet",
        objPos: "center center",
        spine: { en: "Mario Quintana · The Garden", tr: "Mario Quintana · Bahçe" },
        plate: { en: "Plate II — Claude Monet, The Artist’s Garden at Giverny (1900)", tr: "Levha II — Claude Monet, Giverny’deki Sanatçı Bahçesi (1900)" },
        en: {
          q: "“Cultivate a beautiful garden; the butterflies will come. And even if they don't, you will still have a beautiful garden.”",
          a: "Mario Quintana (Attributed)",
          r: "The reward of building value is not external applause, but the inner sanctuary you construct along the way. Butterflies are a pleasant consequence; the garden itself is your sovereign estate."
        },
        tr: {
          q: "“Güzel bir bahçen olsun; kelebekler gelir. Kelebekler gelmese bile, güzel bir bahçen olmuş olur.”",
          a: "Mario Quintana (Atfedilen)",
          r: "Değer üretmenin ödülü dışarıdan gelecek onay değil, inşa edilen içsel ve zihinsel bahçenin bizzat kendisidir. Kelebekler bir sonuçtur; bahçe ise senin mülkündür."
        }
      },
      {
        num: "III",
        imgKey: "hokusai",
        objPos: "center center",
        spine: { en: "Laozi · Mizen Boushi", tr: "Laozi · Mizen Boushi" },
        plate: { en: "Plate III — Katsushika Hokusai, Under the Wave off Kanagawa (1831)", tr: "Levha III — Katsushika Hokusai, Kanagawa Dalgaları (1831)" },
        en: {
          q: "“Deal with a problem before it arises.”",
          a: "Laozi — Tao Te Ching (Ch. 64) & Mizen Boushi (未然防止)",
          r: "What is brittle is easily broken; what is still small is easily guided. True mastery is not heroic struggle against a towering wave, but reading the tide while the water is still calm."
        },
        tr: {
          q: "“Bir sorunu oluşmadan çözmek.”",
          a: "Laozi — Dao De Jing (64. Bölüm) & Mizen Boushi (未然防止)",
          r: "Kırılgan olan kolayca dağılır, henüz küçük olan kolayca yönlendirilir. Gerçek ustalık devleşmiş dalgayla boğuşmak değil, fırtınayı henüz su durgunken okuyup zinciri ilk halkasında çözmektir."
        }
      },
      {
        num: "IV",
        imgKey: "finn",
        objPos: "center center",
        spine: { en: "Adventure Time · Growth", tr: "Adventure Time · Filizlenme" },
        plate: { en: "Plate IV — Adventure Time, Dad’s Dungeon (Season 3, Ep. 25)", tr: "Levha IV — Adventure Time, Dad’s Dungeon (3. Sezon, 25. Bölüm)" },
        en: {
          q: "“You're a beautiful flower and I love to watch you grow.”",
          a: "Adventure Time — Joshua (Season 3, Ep. 25)",
          r: "Looking at your own growth—and at those you care about—not as an impatient judge, but as a patient witness watching a seed unfold in its own season."
        },
        tr: {
          q: "“You're a beautiful flower and I love to watch you grow.”",
          a: "Adventure Time — Joshua (3. Sezon, 25. Bölüm)",
          r: "İnsanın kendi gelişimine ve sevdiklerine dışarıdan bir yargıç gibi değil, toprağa düşmüş bir tohumun filizlenmesini izleyen sabırlı bir tanık gibi bakabilmesi."
        }
      },
      {
        num: "V",
        imgKey: "happiness",
        objPos: "center center",
        spine: { en: "Rota · Mindset Shift", tr: "Rota · Zihniyet Değişimi" },
        plate: { en: "Plate V — Steve Cutts, Happiness (2017)", tr: "Levha V — Steve Cutts, Happiness (2017)" },
        en: {
          q: "“Today, our access to everything is just one moment, one idea, one minute of mindset shift away.”",
          a: "Rota",
          r: "While the crowd rushes blindly toward a 'Sold Out' illusion, stepping out of the rat race takes only a single moment of clarity and a one-minute shift in perspective."
        },
        tr: {
          q: "“Artık hepimizin her şeye erişimi bir an, bir fikir, bir dakikalık zihniyet değişimi kadar uzakta.”",
          a: "Rota",
          r: "Kalabalıklar 'Tükendi' yazan sahte vitrinlere doğru körlemesine koşarken, o fare yarışından çıkıp kendi yolunu kurmak yalnızca bir dakikalık zihniyet değişimi ve karar mesafesindedir."
        }
      }
    ];

    let currentLang = "en";
    let activeIdx = 0;
    const stageEl = document.getElementById("accordion-stage");

    function buildAccordion() {
      const ui = UI_TEXT[currentLang];
      document.getElementById("brand-title").textContent = ui.brand;
      document.getElementById("edition-note").textContent = ui.edition;

      stageEl.innerHTML = "";

      LEAVES_DATA.forEach((item, idx) => {
        const isExp = idx === activeIdx;
        const loc = item[currentLang];

        const panel = document.createElement("article");
        panel.className = "leaf-panel " + (isExp ? "expanded" : "collapsed");
        panel.onclick = (e) => {
          if (activeIdx !== idx) {
            activateLeaf(idx);
          }
        };

        panel.innerHTML = `
          <div class="spine-column">
            <span class="spine-roman">${item.num}</span>
            <span class="spine-vertical-label">${item.spine[currentLang]}</span>
            <span class="spine-dot"></span>
          </div>

          <div class="spread-body">
            <div class="spread-editorial">
              <div class="spread-top-meta">
                <span>${ui.leafWord} ${item.num} / V</span>
                <span>${item.spine[currentLang]}</span>
              </div>

              <div class="spread-quote-wrap">
                <h2 class="spread-quote">${loc.q}</h2>
                <div class="spread-author">${loc.a}</div>
                <p class="spread-root">${loc.r}</p>
              </div>

              <div class="spread-bottom-nav">
                <span>0${idx + 1} — 05</span>
                <div style="display:flex; gap:0.4rem;">
                  <button type="button" class="step-link prev-trigger">${ui.prev}</button>
                  <button type="button" class="step-link next-trigger">${ui.next}</button>
                </div>
              </div>
            </div>

            <div class="spread-art-plate">
              <div class="art-image-well">
                <img class="art-plate-img" src="${REAL_ART[item.imgKey]}" alt="${item.spine[currentLang]}" style="object-position: ${item.objPos};" />
              </div>
              <div class="plate-caption-bar">
                <span>${item.plate[currentLang]}</span>
                <span>${item.num}</span>
              </div>
            </div>
          </div>
        `;

        panel.querySelector(".prev-trigger").onclick = (ev) => {
          ev.stopPropagation();
          activateLeaf((idx - 1 + LEAVES_DATA.length) % LEAVES_DATA.length);
        };

        panel.querySelector(".next-trigger").onclick = (ev) => {
          ev.stopPropagation();
          activateLeaf((idx + 1) % LEAVES_DATA.length);
        };

        stageEl.appendChild(panel);
      });
    }

    function activateLeaf(idx) {
      activeIdx = idx;
      const panels = stageEl.querySelectorAll(".leaf-panel");
      panels.forEach((p, i) => {
        p.classList.toggle("expanded", i === activeIdx);
        p.classList.toggle("collapsed", i !== activeIdx);
      });
    }

    function setLanguage(lang) {
      if (lang === currentLang) return;
      currentLang = lang;
      document.documentElement.lang = lang;
      document.getElementById("lang-en").classList.toggle("active", lang === "en");
      document.getElementById("lang-tr").classList.toggle("active", lang === "tr");
      buildAccordion();
    }

    document.getElementById("lang-en").onclick = () => setLanguage("en");
    document.getElementById("lang-tr").onclick = () => setLanguage("tr");

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") activateLeaf((activeIdx + 1) % LEAVES_DATA.length);
      if (e.key === "ArrowLeft") activateLeaf((activeIdx - 1 + LEAVES_DATA.length) % LEAVES_DATA.length);
    });

    buildAccordion();
  </script>
</body>
</html>
