      if (Tree.isOpen()) { btnTree.classList.remove('active'); Tree.close(); }
      pv.classList.remove('noted', 'comments-open');
      pv.classList.add('writings-open');
      btnWritings.classList.add('active');
      SoundEngine.setSceneState('writings');
      SoundEngine.onWritingTouch(587);
      focusWritingRow(activeWritingIdx, false);
      try { history.replaceState(null, '', '#yazilar'); } catch (e) {}
    } else {
      SoundEngine.onWritingTouch(440);
      pv.classList.remove('writings-open', 'article-reading');
      btnWritings.classList.remove('active');
      pv.style.setProperty('--w-accent', '#e7c9ff');
      pv.style.setProperty('--w-border', 'rgba(231, 201, 255, 0.38)');
      pv.style.setProperty('--w-glow', 'rgba(190, 110, 255, 0.45)');
      pv.style.setProperty('--w-soft', 'rgba(190, 110, 255, 0.16)');
      SoundEngine.setSceneState('in');
      updateHash();
    }
    updateHudLabels();
  }

  writingRows.forEach((row, i) => {
    row.addEventListener('pointerenter', () => {
      if (!pv.classList.contains('article-reading') && activeWritingIdx !== i) {
        focusWritingRow(i, true);
      }
    });
    row.addEventListener('click', e => {
      e.stopPropagation();
      openWritingArticle(i);
    });
  });
  btnWritings.addEventListener('click', e => { e.stopPropagation(); toggleWritingsLayer(); });
  btnWritings.addEventListener('pointerdown', e => e.stopPropagation());
  btnBackList.addEventListener('click', e => { e.stopPropagation(); closeWritingArticle(); });
  $('#article-drawer').addEventListener('pointerdown', e => e.stopPropagation());
  $('#article-drawer').addEventListener('keydown', e => e.stopPropagation());
  applyWritingAtmosphere(0, false);

  /* ---- Yaprak rayı ---- */
  railDots.innerHTML = LEAVES.map((l, i) => '<button type="button" class="rail-dot" data-i="' + i + '"></button>').join('');
  const dots = [...railDots.querySelectorAll('.rail-dot')];
  dots.forEach(d => d.addEventListener('click', e => { e.stopPropagation(); goTo(+d.dataset.i); }));
  const updateRail = () => {
    dots.forEach((d, i) => { d.classList.toggle('on', i === curIdx); d.title = ROMAN(i + 1) + ' · ' + glassName(i); d.setAttribute('aria-label', d.title); });
    railCount.textContent = ROMAN(curIdx + 1) + ' / ' + ROMAN(N_LEAVES);
  };

  /* ---- Yorumlar & Tepkiler ---- */
  const RX_META = {
    leaf: {
      tr: 'Yaprak bırak', en: 'Leave a leaf',
      svg: '<svg viewBox="0 0 20 20"><path d="M16.2 3.8C10.5 3.8 5.2 6.8 4.2 13.2c-.2 1.2.1 2.2.6 2.6.4.5 1.4.8 2.6.6 6.4-1 9.4-6.3 9.4-12-.1-.4-.2-.5-.6-.6z"/><path d="M4.2 15.8c2.8-2.8 6.2-5.6 9.8-7.6"/></svg>'
    },
    heart: {
      tr: 'Kalp bırak', en: 'Send a heart',
      svg: '<svg viewBox="0 0 20 20"><path d="M10 16.5s-6.2-3.9-6.2-8.3c0-2.1 1.6-3.7 3.6-3.7 1.2 0 2.1.6 2.6 1.5.5-.9 1.4-1.5 2.6-1.5 2 0 3.6 1.6 3.6 3.7 0 4.4-6.2 8.3-6.2 8.3z"/></svg>'
    },
    butterfly: {
      tr: 'Kelebek bırak', en: 'Send a butterfly',
      svg: '<svg viewBox="0 0 20 20"><path d="M10 6.8C8.1 3.3 3.3 2.8 2.7 6.3c-.4 2.1 1.7 3.7 4.1 4-1.9.6-3.2 2.2-2.4 4.1.9 2 4 1.5 5.6-1.3 1.6 2.8 4.7 3.3 5.6 1.3.8-1.9-.5-3.5-2.4-4.1 2.4-.3 4.5-1.9 4.1-4-.6-3.5-5.4-3-7.3.5z"/><path d="M10 4.8v10.5"/></svg>'
    }
  };
  const renderCommentsList = list => {
    commentCount = list.length;
    updateHudLabels();
    if (!list.length) { cList.innerHTML = '<div class="c-empty">' + L('Henüz bırakılmış bir iz yok. İlk yorumu sen bırakabilirsin.', 'No reflections yet. Be the first to leave a trace.') + '</div>'; return; }
    cList.innerHTML = list.map(item => {
      const avIdx = (typeof item.av === 'number' && item.av >= 0 && item.av < 10) ? item.av : 0;
      const rxCounts = item.rxCounts || {}, myRx = item.myRx || {};
      const rxBtns = RX_KEYS.map(rk => {
        const cnt = rxCounts[rk] || 0, isOn = !!myRx[rk], m = RX_META[rk];
        const title = L(m.tr, m.en);
        return '<button type="button" class="c-rx-btn' + (isOn ? ' on' : '') + '" data-cid="' + escapeHtml(item.id) + '" data-rx="' + rk + '" title="' + title + '" aria-label="' + title + '" aria-pressed="' + (isOn ? 'true' : 'false') + '">' +
          m.svg + (cnt > 0 ? '<span class="c-rx-cnt">' + cnt + '</span>' : '') + '</button>';
      }).join('');
      return '<div class="c-item">' +
        '<img class="c-av" src="' + avatarSrc(avIdx) + '" alt="" loading="lazy" title="' + escapeHtml(ART_NAMES[avIdx] || '') + '" />' +
        '<div class="c-body"><div class="c-meta">' +
          '<span class="c-user">' + escapeHtml(item.user) + '</span>' +
          '<button type="button" class="c-leaf-tag" data-leaf="' + (item.leaf | 0) + '" title="' + escapeHtml(L('Bu yaprağa git', 'Go to this leaf')) + '">' + escapeHtml(leafShort(item.leaf)) + '</button>' +
          '<span class="c-time">' + escapeHtml(formatExactDateTime(item.ts)) + '</span>' +
        '</div><p class="c-msg">' + escapeHtml(item.text) + '</p>' +
        '<div class="c-rx-bar">' + rxBtns + '</div></div></div>';
    }).join('');
  };

  /* ---- Etiketler ---- */
  function updateHudLabels() {
    const lf = LEAVES[curIdx], isComments = pv.classList.contains('comments-open');
    inqPillTxt.textContent = L(lf.pillTr, lf.pillEn) + ' · ↓';
    dosClose.textContent = L('↑ Söze Dön', '↑ Back to Quote');
    btnComments.classList.toggle('active', isComments);
    btnCommentsLbl.textContent = L('Yorumlar', 'Reflections') + (commentCount > 0 ? ' (' + commentCount + ')' : '');
    btnTreeLbl.textContent = L('Ağaç', 'Tree');
    btnTree.title = L('Ağacın bütününü gör (↑)', 'See the whole tree (↑)');
    btnWritingsLbl.textContent = L('Yazılar', 'Writings');
    btnWritings.title = L('Yazılarım', 'My Writings');
    idxTitleEm.textContent = L('Yazılarım', 'My Writings');
    btnBackList.textContent = L('← BAŞLIKLARA DÖN', '← BACK TO TITLES');
    btnMute.title = L('Sesi aç / kapat', 'Sound on / off'); btnMute.setAttribute('aria-label', btnMute.title);
    posterCard.title = L('Köken ve sorgulama kaydını görmek için dokun', 'Tap to see provenance & inquiry');
    cTitle.innerHTML = L('İz Bırak · <em>Yorumlar</em>', 'Leave a Trace · <em>Reflections</em>');
    cSub.textContent = L('Bir kullanıcı adı seçip düşünceni doğrudan bırakabilirsin', 'Pick a username and share your reflection directly');
    cClose.textContent = L('✕ Kapat', '✕ Close');
    cUser.placeholder = L('Kullanıcı adın / Rumuzun...', 'Your username / handle...');
    cText.placeholder = L('“' + leafShort(curIdx) + '” yaprağına veya ağaca dair bıraktığın iz...', 'A reflection on “' + leafShort(curIdx) + '” or the tree...');
    cSend.textContent = L('Gönder →', 'Send →');
  }

  function renderLeafText() {
    const lf = LEAVES[curIdx], t = lf[curLang];
    poster.dataset.size = t.size || lf.size;
    $('.p1').textContent = t.p[0]; $('.p2').textContent = t.p[1]; $('.p3').textContent = t.p[2];
    poster.setAttribute('aria-label', t.p.join(' '));
    dosSrc.textContent = t.src;
    dosDate.textContent = ROMAN(curIdx + 1) + ' / ' + ROMAN(N_LEAVES) + ' · ' + glassName(curIdx) + ' · ' + L(lf.dateTr, lf.dateEn);
    dosSteps.innerHTML = t.steps.map(st => {
      let inner = '<div class="dos-kicker">' + st.k + '</div>';
      if (st.q) inner += '<p class="dos-q">' + st.q + '</p>';
      if (st.b) inner += '<p class="dos-body">' + st.b + '</p>';
      if (st.orig) inner += '<div class="dos-orig">' + st.orig.replace(RTL_RUN, '<bdi dir="rtl" class="rtl">$1</bdi>').replace(/<\/bdi>\s*[—–-]\s*/g, '</bdi>') + '</div>';
      if (st.linkUrl) inner += '<a class="dos-link" href="' + st.linkUrl + '" target="_blank" rel="noopener">' + st.linkLabel + '</a>';
      return '<div class="dos-step">' + inner + '</div>';
    }).join('');
    dosSteps.parentElement.scrollTop = 0;
    pv.lang = curLang;
    updateHudLabels(); updateRail();
    renderCommentsList(CommentEngine.getVisibleComments());
  }

  const Tree = makeTree(pv, { getCur: () => curIdx, lang: () => curLang, onPick: i => { btnTree.classList.remove('active'); goTo(i, true); } });

  function setLang(l) {
    curLang = l;
    try { localStorage.setItem('fa_lang', l); } catch (e) {}
    document.documentElement.lang = l;
    renderLeafText();
    renderWritingsText();
    $('.mtxt').innerHTML = MANI[l].map(s => '<span class="s">' + s + ' </span>').join('');
    Tree.setLang(l);
  }
  let initLang = 'tr';
  try { if (localStorage.getItem('fa_lang') === 'en') initLang = 'en'; } catch (e) {}
  setLang(initLang);
  CommentEngine.init(renderCommentsList);

  if (COARSE) {
    $('#hint-en').textContent = 'Please turn on your sound and swipe through the leaves.';
    $('#hint-tr').textContent = 'Lütfen sesi açın ve yapraklar arasında parmağınızla kaydırın.';
    $('#hint-keys').innerHTML = '<span class="kc">⟵</span><span class="kc">⟶</span>';
  }

  const updateHash = () => { if (pv.classList.contains('in') && !pv.classList.contains('writings-open')) try { history.replaceState(null, '', '#yaprak-' + LEAVES[curIdx].id); } catch (e) {} };

  function goTo(nextIdx, fromTree) {
    nextIdx = ((nextIdx % N_LEAVES) + N_LEAVES) % N_LEAVES;
    if (busy) return;
    if (nextIdx === curIdx) { if (!fromTree) return; pv.classList.remove('noted', 'comments-open'); SoundEngine.setSceneState('in'); return; }
    busy = true;
    pv.classList.remove('noted', 'comments-open');
    pv.classList.add('switching');
    SoundEngine.setSceneState('in');
    SoundEngine.onLeafSwitch(nextIdx);
    Scene.switchTo(nextIdx);
    Scene.setTint(LEAVES[nextIdx].tint);
    setTimeout(() => {
      curIdx = nextIdx;
      renderLeafText(); updateHash();
      requestAnimationFrame(() => { pv.classList.remove('switching'); setTimeout(() => { busy = false; }, 280); });
    }, 240);
  }
  const goLeaf = d => goTo(curIdx + d);

  const triggerIntro = () => { pv.classList.remove('in', 'noted', 'comments-open', 'man', 'booted', 'switching'); requestAnimationFrame(() => requestAnimationFrame(() => pv.classList.add('booted'))); };
  triggerIntro();

  const wm = location.hash.match(/^#(yazilar|yazi-([\w-]+))$/);
  const deepWritingIdx = (wm && wm[2]) ? WRITINGS.findIndex(w => w.id === wm[2]) : -1;
  const hasDeepWriting = !!wm;

  const enter = () => {
    pv.classList.remove('man');
    pv.classList.add('in');
    if (hasDeepWriting) {
      toggleWritingsLayer(true);
      if (deepWritingIdx >= 0) openWritingArticle(deepWritingIdx);
    } else {
      SoundEngine.setSceneState('in');
      updateHash();
    }
  };
  pv.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    setLang(b.dataset.lang);
    if (deepIdx >= 0 || hasDeepWriting) { enter(); SoundEngine.start(); }
    else { pv.classList.add('man'); SoundEngine.setSceneState('man'); SoundEngine.start(); }
  }));
  $('.mani').addEventListener('click', enter);

  const toggleNote = forceState => {
    if (!pv.classList.contains('in') || Tree.isOpen() || pv.classList.contains('writings-open')) return;
    pv.classList.remove('comments-open');
    const shouldOpen = typeof forceState === 'boolean' ? forceState : !pv.classList.contains('noted');
    pv.classList.toggle('noted', shouldOpen);
    SoundEngine.setSceneState(shouldOpen ? 'note' : 'in');
    SoundEngine.onDossierToggle(shouldOpen);
    updateHudLabels();
  };
  const toggleComments = forceState => {
    if (!pv.classList.contains('in') || Tree.isOpen() || pv.classList.contains('writings-open')) return;
    pv.classList.remove('noted');
    const shouldOpen = typeof forceState === 'boolean' ? forceState : !pv.classList.contains('comments-open');
    pv.classList.toggle('comments-open', shouldOpen);
    SoundEngine.setSceneState(shouldOpen ? 'note' : 'in');
    SoundEngine.onDossierToggle(shouldOpen);
    updateHudLabels();
  };
  const openTree = () => {
    if (!pv.classList.contains('in')) return;
    if (pv.classList.contains('writings-open')) toggleWritingsLayer(false);
    pv.classList.remove('noted', 'comments-open');
    btnTree.classList.add('active');
    Tree.open();
  };
  const closeTree = () => { btnTree.classList.remove('active'); Tree.close(); SoundEngine.setSceneState('in'); };

  posterCard.addEventListener('click', e => { e.stopPropagation(); if (pv._swiped) return; toggleNote(true); });
  posterCard.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); toggleNote(true); } });
  dosClose.addEventListener('click', e => { e.stopPropagation(); toggleNote(false); });
  cClose.addEventListener('click', e => { e.stopPropagation(); toggleComments(false); });
  btnComments.addEventListener('click', e => { e.stopPropagation(); toggleComments(); });
  btnTree.addEventListener('click', e => {
    e.stopPropagation();
    if (pv.classList.contains('writings-open')) {
      toggleWritingsLayer(false);
    } else if (Tree.isOpen()) {
      closeTree();
    } else {
      openTree();
    }
  });
  btnTree.addEventListener('pointerdown', e => e.stopPropagation());

  const drawer = $('#c-drawer'), dossierEl = $('#dossier');
  drawer.addEventListener('keydown', e => e.stopPropagation());
  drawer.addEventListener('pointerdown', e => e.stopPropagation());
  dossierEl.addEventListener('pointerdown', e => e.stopPropagation());

  cList.addEventListener('click', e => {
    const rxBtn = e.target.closest('.c-rx-btn');
    if (rxBtn) {
      e.stopPropagation();
      CommentEngine.toggleReaction(rxBtn.dataset.cid, rxBtn.dataset.rx);
      return;
    }
    const lfBtn = e.target.closest('.c-leaf-tag');
    if (lfBtn && lfBtn.dataset.leaf !== undefined) {
      e.stopPropagation();
      const targetLeaf = Number(lfBtn.dataset.leaf);
      toggleComments(false);
      if (targetLeaf !== curIdx) goTo(targetLeaf);
    }
  });

  // Açık panel dışındaki karanlık perdeye tıklayınca paneli kapat
  pv.addEventListener('click', e => {
    if (pv._swiped) return;
    if (e.target.closest('.dossier,.c-drawer,.article-drawer,.writings-index,.poster-wrap,.hud-bar,.rail,.hud-mute,.tree,.intro,.mani')) return;
    if (pv.classList.contains('article-reading')) closeWritingArticle();
    else if (pv.classList.contains('noted')) toggleNote(false);
    else if (pv.classList.contains('comments-open')) toggleComments(false);
  });

  cForm.addEventListener('submit', async e => {
    e.preventDefault(); e.stopPropagation();
    cSend.disabled = true;
    cStatus.textContent = L('Gönderiliyor...', 'Sending...');
    try {
      await CommentEngine.postComment(cUser.value, cText.value, curIdx);
      cText.value = '';
      cStatus.textContent = L('İzin ağaca eklendi.', 'Your reflection has been added.');
      setTimeout(() => { cStatus.textContent = ''; }, 3000);
    } catch (err) {
      cStatus.textContent = err.message === 'rate_limit' ? L('Yeni bir yorum için lütfen birkaç saniye bekle.', 'Please wait a few seconds before posting again.')
        : err.message === 'link_spam' ? L('Spam koruması nedeniyle yorumlarda bağlantıya izin verilmiyor.', 'Links are not allowed in reflections.')
        : L('Gönderilemedi, bağlantını kontrol edip tekrar dene.', 'Could not send. Check your connection and try again.');
    } finally { cSend.disabled = false; }
  });

  /* ---- Klavye ---- */
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    if (pv.classList.contains('man') && (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); enter(); return; }
    if (!pv.classList.contains('in')) return;
    if (pv.classList.contains('writings-open')) {
      if (!pv.classList.contains('article-reading')) {
        if (e.key === 'ArrowDown') { e.preventDefault(); focusWritingRow(activeWritingIdx + 1, true); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); focusWritingRow(activeWritingIdx - 1, true); }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openWritingArticle(activeWritingIdx); }
        else if (e.key === 'Escape') { e.preventDefault(); toggleWritingsLayer(false); }
      } else {
        if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); closeWritingArticle(); }
      }
      return;
    }
    if (Tree.isOpen()) {
      if (e.key === 'Escape' || e.key === 'ArrowDown') { e.preventDefault(); if (e.key === 'ArrowDown' && Tree.hasSel()) Tree.pickSel(); else closeTree(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); Tree.moveSel(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); Tree.moveSel(-1); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); Tree.pickSel(); }
      return;
    }
    if (e.key === 'Escape' && (pv.classList.contains('noted') || pv.classList.contains('comments-open'))) {
      e.preventDefault(); pv.classList.remove('noted', 'comments-open'); SoundEngine.setSceneState('in'); updateHudLabels(); return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goLeaf(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goLeaf(-1); }
    else if (e.key === 'ArrowDown' && !pv.classList.contains('noted')) { e.preventDefault(); toggleNote(true); }
    else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (pv.classList.contains('noted')) toggleNote(false);
      else if (pv.classList.contains('comments-open')) toggleComments(false);
      else openTree();
    }
  });

  /* ---- Dokunmatik kaydırma: ← → yaprak, ↑ köken kaydı, ↓ ağaç ---- */
  let sw = null;
  pv.addEventListener('pointerdown', e => {
    pv._swiped = false;
    if (!pv.classList.contains('in') || Tree.isOpen() || pv.classList.contains('writings-open') || e.target.closest('.dossier,.c-drawer,.writings-layer,.tree,button,input,textarea,a')) { sw = null; return; }
    sw = { x: e.clientX, y: e.clientY, id: e.pointerId };
  }, true);
  pv.addEventListener('pointerup', e => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    const reading = pv.classList.contains('noted') || pv.classList.contains('comments-open');
    if (ax > 44 && ax > ay * 1.2) { pv._swiped = true; goLeaf(dx < 0 ? 1 : -1); }
    else if (ay > 50 && ay > ax) {
      pv._swiped = true;
      if (dy < 0) { if (!reading) toggleNote(true); }
      else { if (reading) { toggleNote(false); toggleComments(false); } else openTree(); }
    }
  }, true);
  pv.addEventListener('pointercancel', () => { sw = null; }, true);

  btnMute.addEventListener('click', e => {
    e.stopPropagation();
    const on = SoundEngine.toggleMute();
    btnMute.classList.toggle('muted', !on);
    icoMute.innerHTML = on
      ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>'
      : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
  });
  btnMute.addEventListener('pointerdown', e => e.stopPropagation());

  window.addEventListener('hashchange', () => {
    if (!pv.classList.contains('in')) return;
    const hw = location.hash.match(/^#(yazilar|yazi-([\w-]+))$/);
    if (hw) {
      toggleWritingsLayer(true);
      const wi = hw[2] ? WRITINGS.findIndex(w => w.id === hw[2]) : -1;
      if (wi >= 0) openWritingArticle(wi);
      else closeWritingArticle();
      return;
    }
    const m2 = location.hash.match(/yaprak-([\w-]+)/);
    const i = m2 ? LEAVES.findIndex(l => l.id === m2[1]) : -1;
    if (i >= 0) {
      if (pv.classList.contains('writings-open')) toggleWritingsLayer(false);
      if (Tree.isOpen()) closeTree();
      if (i !== curIdx) goTo(i);
    }
  });
})();
</script>
</body>
</html>
