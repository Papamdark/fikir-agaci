<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Fikir Ağacı / The Idea Tree — Celil Yıldırım</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..400&family=Inter+Tight:wght@200;300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0418; color: #f4effd;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    user-select: none;
  }
  .pv {
    --serif: "Fraunces", Georgia, serif;
    --sans: "Inter Tight", system-ui, sans-serif;
    container-type: inline-size; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; isolation: isolate; color: #f4effd; cursor: default;
    background: radial-gradient(70% 90% at 28% 50%, #2b0e5c 0%, #140630 42%, #0a0418 75%);
    transition: background .85s cubic-bezier(.22,1,.36,1);
  }
  .pv:fullscreen { aspect-ratio: auto; width: 100vw; height: 100vh; border-radius: 0; }
  .pv.full { position: fixed; inset: 0; z-index: 50; aspect-ratio: auto; border-radius: 0; }
  .pv canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; transition: filter .75s cubic-bezier(.22,1,.36,1); }
  .pv.noted canvas.fx, .pv.comments-open canvas.fx { filter: blur(3px) saturate(.88); }
  .grain { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; opacity: .075; mix-blend-mode: overlay; image-rendering: pixelated; }
  .abs { position: absolute; z-index: 10; pointer-events: none; }
  .ease { transition-timing-function: cubic-bezier(.16,.84,.24,1); }

  /* ---- Okuma Odak Perdesi ---- */
  .focus-veil {
    position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
    background: radial-gradient(58% 82% at 68% 50%, rgba(12, 5, 28, .88) 0%, rgba(8, 3, 20, .68) 60%, rgba(6, 2, 15, .42) 100%);
    transition: opacity .65s cubic-bezier(.22,1,.36,1);
  }
  .pv.noted .focus-veil, .pv.comments-open .focus-veil { opacity: 1; }

  /* ---- Afiş (Akıcı & Tepkisel 120fps Geçişler) ---- */
  .poster-wrap {
    right: 8cqi; top: 50%; transform: translateY(-50%); text-align: right; max-width: 54cqi;
    pointer-events: auto; cursor: pointer;
    transition: opacity .52s cubic-bezier(.22,1,.36,1), transform .68s cubic-bezier(.22,1,.36,1), filter .52s cubic-bezier(.22,1,.36,1);
  }
  .poster { margin: 0; line-height: .94; }
  .poster span { display: block; opacity: 0; transform: translate3d(0, .75cqi, 0); filter: blur(7px); will-change: opacity, transform, filter;
    transition: opacity .72s cubic-bezier(.22,1,.36,1), transform .82s cubic-bezier(.22,1,.36,1), filter .72s cubic-bezier(.22,1,.36,1); }
  .pv.in:not(.switching) .poster span { opacity: 1; transform: translate3d(0, 0, 0); filter: blur(0px); }
  .pv.in:not(.switching) .poster .p1 { transition-delay: .06s; }
  .pv.in:not(.switching) .poster .p2 { transition-delay: .18s; }
  .pv.in:not(.switching) .poster .p3 { transition-delay: .30s; }
  .pv.switching .poster span { transition-duration: .24s; transition-delay: 0s !important; opacity: 0; transform: translate3d(0, -.45cqi, 0); filter: blur(6px); }

  /* Kısa / Vurgulu Sözler (Sadi, Laozi) */
  .p1 { font-family: var(--sans); font-weight: 200; font-size: 5.2cqi; letter-spacing: -.03em; }
  .p2 { font-family: var(--serif); font-style: italic; font-size: 5.8cqi; letter-spacing: -.02em; color: #e7c9ff; margin-right: 5.2cqi; margin-top: .18cqi; }
  .p3 { font-family: var(--serif); font-size: 10.2cqi; letter-spacing: -.04em; margin-right: -.3cqi; margin-top: .12cqi; }
  .pv[lang="en"] .poster[data-size="lg"] .p1 { font-size: 4.6cqi; }
  .pv[lang="en"] .poster[data-size="lg"] .p2 { font-size: 5.2cqi; margin-right: 3.8cqi; }
  .pv[lang="en"] .poster[data-size="lg"] .p3 { font-size: 8.8cqi; }

  /* Orta Uzunlukta Sözler (Adventure Time) */
  .poster[data-size="md"] { line-height: 1.04; }
  .poster[data-size="md"] .p1 { font-size: 3.8cqi; }
  .poster[data-size="md"] .p2 { font-size: 4.6cqi; margin-right: 3.6cqi; margin-top: .3cqi; }
  .poster[data-size="md"] .p3 { font-size: 7.4cqi; letter-spacing: -.035em; margin-top: .2cqi; }

  /* İki Cümlelik / Uzun Sözler (Quintana, Rota) */
  .poster[data-size="sm"] { line-height: 1.12; max-width: 52cqi; }
  .poster[data-size="sm"] .p1 { font-size: 2.65cqi; letter-spacing: -.015em; color: rgba(244,239,253,.9); }
  .poster[data-size="sm"] .p2 { font-size: 3.35cqi; margin-right: 2.4cqi; margin-top: .45cqi; }
  .poster[data-size="sm"] .p3 { font-size: 4.55cqi; letter-spacing: -.028em; margin-right: 0; margin-top: .35cqi; line-height: 1.06; }

  /* ---- Sahnede Kaynakça & Sorgulama Mührü ---- */
  .inq-pill {
    margin-top: 2.4cqi; display: inline-flex; align-items: center; gap: .75cqi;
    padding: .62cqi 1.35cqi .62cqi 1.05cqi; border-radius: 99px;
    border: 1px solid rgba(231, 201, 255, .22);
    background: rgba(24, 10, 48, .48); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-family: var(--sans); font-size: max(10px, .92cqi); letter-spacing: .2em; text-transform: uppercase;
    color: rgba(244, 239, 253, .72); cursor: pointer;
    opacity: 0; transform: translate3d(0, .5cqi, 0); filter: blur(5px);
    transition: opacity .68s cubic-bezier(.22,1,.36,1) .42s, transform .68s cubic-bezier(.22,1,.36,1) .42s, filter .68s cubic-bezier(.22,1,.36,1) .42s, border-color .3s, color .3s, background .3s, box-shadow .4s;
  }
  .pv.in:not(.switching) .inq-pill { opacity: 1; transform: translate3d(0, 0, 0); filter: blur(0px); }
  .pv.switching .inq-pill { transition-duration: .2s; transition-delay: 0s !important; opacity: 0; filter: blur(5px); }
  .poster-wrap:hover .inq-pill, .inq-pill:hover {
    color: #fff; border-color: rgba(231, 201, 255, .62);
    background: rgba(190, 110, 255, .14); box-shadow: 0 0 2.6cqi -.4cqi rgba(190, 110, 255, .45);
  }
  .inq-dot {
    width: .52cqi; height: .52cqi; min-width: 6px; min-height: 6px; border-radius: 50%;
    background: #e7c9ff; box-shadow: 0 0 8px #e7c9ff;
    animation: pulseDot 2.6s ease-in-out infinite;
  }
  @keyframes pulseDot { 0%, 100% { opacity: .45; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.18); } }

  .pv.noted .poster-wrap, .pv.comments-open .poster-wrap { opacity: 0; transform: translateY(-55%); filter: blur(7px); pointer-events: none; }

  /* ---- Köken & Sorgulama Dosyası (Derin Okuma Kartı) ---- */
  .dossier {
    right: 6.5cqi; top: 48%; width: min(88vw, 46cqi); max-height: 76vh;
    transform: translateY(-45%) scale(.985); opacity: 0; filter: blur(8px);
    pointer-events: none; overflow-y: auto; scrollbar-width: thin;
    padding: 2.2cqi 2.5cqi; border-radius: 1.4cqi;
    background: rgba(16, 7, 36, .76);
    border: 1px solid rgba(231, 201, 255, .18);
    box-shadow: 0 28px 80px -20px rgba(0, 0, 0, .75), inset 0 1px 0 rgba(255, 255, 255, .08);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    transition: opacity .55s cubic-bezier(.22,1,.36,1), transform .65s cubic-bezier(.22,1,.36,1), filter .55s cubic-bezier(.22,1,.36,1);
  }
  .pv.noted:not(.comments-open) .dossier {
    opacity: 1; transform: translateY(-50%) scale(1); filter: blur(0px);
    pointer-events: auto; transition-delay: .08s;
  }
  .dos-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1cqi;
    padding-bottom: 1.1cqi; margin-bottom: 1.35cqi;
    border-bottom: 1px solid rgba(244, 239, 253, .11);
  }
  .dos-src {
    font-family: var(--sans); font-size: max(10px, .96cqi); letter-spacing: .22em;
    text-transform: uppercase; color: #e7c9ff; font-weight: 400;
  }
  .dos-date {
    font-family: var(--sans); font-size: max(9px, .82cqi); letter-spacing: .18em;
    text-transform: uppercase; color: rgba(244, 239, 253, .45); white-space: nowrap;
  }
  .dos-close {
    font-family: var(--sans); font-size: max(9px, .82cqi); letter-spacing: .2em;
    text-transform: uppercase; color: rgba(244, 239, 253, .55); background: rgba(255,255,255,.04);
    border: 1px solid rgba(244,239,253,.14); border-radius: 99px; padding: .35cqi .9cqi;
    cursor: pointer; transition: color .3s, border-color .3s, background .3s;
  }
  .dos-close:hover { color: #fff; border-color: rgba(231,201,255,.5); background: rgba(190,110,255,.12); }

  .dos-steps { display: flex; flex-direction: column; gap: 1.25cqi; }
  .dos-step {
    padding-left: 1.15cqi; border-left: 2px solid rgba(231, 201, 255, .22);
    transition: border-color .35s ease, opacity .35s ease, transform .35s ease;
  }
  .dos-steps:hover .dos-step { opacity: .62; }
  .dos-steps .dos-step:hover { opacity: 1; border-left-color: #e7c9ff; transform: translateX(.18cqi); }
  .dos-kicker {
    font-family: var(--sans); font-size: max(9px, .8cqi); letter-spacing: .22em;
    text-transform: uppercase; color: rgba(231, 201, 255, .68); margin-bottom: .38cqi;
  }
  .dos-q {
    font-family: var(--serif); font-style: italic; font-size: max(13px, 1.32cqi);
    line-height: 1.52; color: #f6f1ff; text-wrap: pretty;
  }
  .dos-body {
    font-family: var(--serif); font-size: max(13px, 1.28cqi);
    line-height: 1.62; color: rgba(244, 239, 253, .86); text-wrap: pretty;
  }
  .dos-body em, .dos-q em { color: #e7c9ff; font-style: italic; }
  .dos-orig {
    margin-top: .55cqi; padding: .55cqi .9cqi; border-radius: .6cqi;
    background: rgba(255, 255, 255, .03); border: 1px solid rgba(244, 239, 253, .08);
    font-family: var(--serif); font-size: max(12px, 1.18cqi); line-height: 1.5;
    color: rgba(231, 201, 255, .92);
  }
  .dos-link {
    display: inline-flex; align-items: center; gap: .4cqi; margin-top: .55cqi;
    font-family: var(--sans); font-size: max(9px, .82cqi); letter-spacing: .18em;
    text-transform: uppercase; color: #e7c9ff; text-decoration: none;
    border-bottom: 1px solid rgba(231, 201, 255, .35); padding-bottom: 2px;
    transition: color .3s, border-color .3s;
  }
  .dos-link:hover { color: #fff; border-color: #fff; }

  /* ---- İz Bırak / Yorumlar Paneli (Gece Camı Misafir Defteri) ---- */
  .c-drawer {
    right: 6.5cqi; top: 48%; width: min(90vw, 42cqi); max-height: 76vh;
    transform: translateY(-45%) scale(.985); opacity: 0; filter: blur(8px);
    pointer-events: none; display: flex; flex-direction: column;
    padding: 2cqi 2.3cqi; border-radius: 1.4cqi;
    background: rgba(16, 7, 36, .80);
    border: 1px solid rgba(231, 201, 255, .20);
    box-shadow: 0 28px 80px -20px rgba(0, 0, 0, .82), inset 0 1px 0 rgba(255, 255, 255, .08);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    transition: opacity .52s cubic-bezier(.22,1,.36,1), transform .62s cubic-bezier(.22,1,.36,1), filter .52s cubic-bezier(.22,1,.36,1);
  }
  .pv.comments-open .c-drawer {
    opacity: 1; transform: translateY(-50%) scale(1); filter: blur(0px);
    pointer-events: auto;
  }
  .c-head {
    display: flex; align-items: center; justify-content: space-between; gap: 1cqi;
    padding-bottom: .95cqi; margin-bottom: 1.1cqi;
    border-bottom: 1px solid rgba(244, 239, 253, .11);
  }
  .c-title {
    font-family: var(--serif); font-size: max(16px, 1.55cqi); color: #f6f1ff; font-weight: 400;
  }
  .c-title em { font-style: italic; color: #e7c9ff; }
  .c-sub {
    font-family: var(--sans); font-size: max(9px, .78cqi); letter-spacing: .2em;
    text-transform: uppercase; color: rgba(244, 239, 253, .45); margin-top: .2cqi;
  }
  .c-head-actions { display: flex; align-items: center; gap: .5cqi; }
  .c-mod-btn {
    font-family: var(--sans); font-size: max(9px, .76cqi); letter-spacing: .16em;
    text-transform: uppercase; color: rgba(244, 239, 253, .4); background: transparent;
    border: 1px solid rgba(244, 239, 253, .1); border-radius: 99px; padding: .3cqi .7cqi;
    cursor: pointer; transition: color .3s, border-color .3s, background .3s;
  }
  .c-mod-btn:hover, .c-mod-btn.unlocked { color: #e7c9ff; border-color: rgba(231, 201, 255, .45); background: rgba(190, 110, 255, .1); }

  /* Yönetici Şifre Satırı */
  .c-mod-bar {
    display: none; align-items: center; gap: .5cqi; margin-bottom: .9cqi;
    padding: .5cqi .75cqi; border-radius: .65cqi;
    background: rgba(255, 255, 255, .03); border: 1px solid rgba(231, 201, 255, .18);
  }
  .c-mod-bar.show { display: flex; }
  .c-mod-inp {
    flex: 1; background: transparent; border: none; outline: none;
    font-family: var(--sans); font-size: max(11px, .92cqi); color: #fff;
  }
  .c-mod-inp::placeholder { color: rgba(244, 239, 253, .38); }

  /* Yorum Yazma Formu */
  .c-form { display: flex; flex-direction: column; gap: .65cqi; margin-bottom: 1.15cqi; }
  .c-row { display: flex; gap: .65cqi; align-items: center; }
  .c-inp, .c-txt {
    width: 100%; background: rgba(255, 255, 255, .035);
    border: 1px solid rgba(244, 239, 253, .14); border-radius: .7cqi;
    padding: .62cqi .9cqi; color: #f6f1ff; outline: none;
    font-family: var(--sans); font-size: max(12px, .98cqi);
    transition: border-color .3s, background .3s, box-shadow .3s;
    user-select: text;
  }
  .c-txt {
    font-family: var(--serif); font-size: max(13px, 1.08cqi);
    min-height: 4.2cqi; max-height: 9cqi; resize: none; line-height: 1.48;
  }
  .c-inp:focus, .c-txt:focus {
    border-color: rgba(231, 201, 255, .52); background: rgba(255, 255, 255, .055);
    box-shadow: 0 0 1.8cqi -.4cqi rgba(190, 110, 255, .32);
  }
  .c-inp::placeholder, .c-txt::placeholder { color: rgba(244, 239, 253, .38); }
  .c-send {
    align-self: flex-end; font-family: var(--sans); font-size: max(10px, .86cqi);
    letter-spacing: .22em; text-transform: uppercase; color: #fff;
    background: rgba(190, 110, 255, .18); border: 1px solid rgba(231, 201, 255, .42);
    border-radius: 99px; padding: .55cqi 1.45cqi; cursor: pointer;
    transition: background .3s, border-color .3s, box-shadow .35s, transform .2s;
  }
  .c-send:hover { background: rgba(190, 110, 255, .28); border-color: #e7c9ff; box-shadow: 0 0 2.2cqi -.3cqi rgba(190, 110, 255, .5); }
  .c-send:disabled { opacity: .45; cursor: default; }
  .c-status {
    font-family: var(--sans); font-size: max(10px, .82cqi); color: #e7c9ff;
    min-height: 1.1em;
  }

  /* Yorum Listesi */
  .c-list {
    flex: 1; overflow-y: auto; scrollbar-width: thin;
    display: flex; flex-direction: column; gap: .75cqi;
    padding-right: .25cqi; max-height: 36vh;
  }
  .c-item {
    padding: .85cqi 1.05cqi; border-radius: .8cqi;
    background: rgba(255, 255, 255, .025);
    border: 1px solid rgba(244, 239, 253, .08);
    transition: border-color .3s, background .3s;
  }
  .c-item:hover { border-color: rgba(231, 201, 255, .22); background: rgba(255, 255, 255, .04); }
  .c-meta {
    display: flex; align-items: center; justify-content: space-between; gap: .6cqi;
    margin-bottom: .35cqi;
  }
  .c-user {
    font-family: var(--sans); font-size: max(11px, .92cqi); font-weight: 500;
    color: #e7c9ff; letter-spacing: .04em;
  }
  .c-leaf-tag {
    font-family: var(--sans); font-size: max(8px, .72cqi); letter-spacing: .16em;
    text-transform: uppercase; color: rgba(244, 239, 253, .45);
    padding: .15cqi .5cqi; border-radius: 99px; border: 1px solid rgba(244, 239, 253, .12);
  }
  .c-time {
    font-family: var(--sans); font-size: max(9px, .74cqi); color: rgba(244, 239, 253, .38);
    margin-left: auto;
  }
  .c-del {
    font-family: var(--sans); font-size: max(9px, .74cqi); letter-spacing: .12em;
    text-transform: uppercase; color: #ff9bb3; background: rgba(255, 80, 120, .1);
    border: 1px solid rgba(255, 120, 150, .3); border-radius: 99px;
    padding: .15cqi .55cqi; cursor: pointer; transition: background .25s, color .25s;
  }
  .c-del:hover { background: rgba(255, 80, 120, .25); color: #fff; }
  .c-msg {
    font-family: var(--serif); font-size: max(12.5px, 1.12cqi); line-height: 1.52;
    color: rgba(244, 239, 253, .88); text-wrap: pretty; word-break: break-word;
    user-select: text;
  }
  .c-empty {
    font-family: var(--serif); font-style: italic; font-size: max(12px, 1.05cqi);
    color: rgba(244, 239, 253, .42); text-align: center; padding: 1.6cqi 0;
  }

  /* ---- Zarif Sahne İçi Kontroller ---- */
  .hud-bar {
    position: absolute; left: 4.5cqi; right: 4.5cqi; bottom: 3.2cqi; z-index: 12;
    display: flex; align-items: center; justify-content: space-between;
    opacity: 0; pointer-events: none; transform: translate3d(0, .35cqi, 0);
    transition: opacity .75s cubic-bezier(.22,1,.36,1) .35s, transform .75s cubic-bezier(.22,1,.36,1) .35s;
  }
  .pv.in .hud-bar { opacity: 1; pointer-events: auto; transform: translate3d(0, 0, 0); }
  .hud-grp { display: flex; align-items: center; gap: .6cqi; flex-wrap: wrap; }
  .hud-btn {
    font-family: var(--sans); font-size: max(10px, .85cqi); letter-spacing: .19em; text-transform: uppercase;
    color: rgba(244,239,253,.56); background: rgba(255,255,255,.025);
    border: 1px solid rgba(244,239,253,.13); border-radius: 99px;
    padding: .52cqi 1.18cqi; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: color .3s, border-color .3s, background .3s, box-shadow .4s;
  }
  .hud-btn:hover, .hud-btn.active { color: #fff; border-color: rgba(231,201,255,.52); background: rgba(190,110,255,.11); box-shadow: 0 0 2cqi -.3cqi rgba(190,110,255,.38); }
  .hud-lbl {
    font-family: var(--sans); font-size: max(10px, .85cqi); letter-spacing: .21em; text-transform: uppercase;
    color: rgba(244,239,253,.42); padding: 0 .45cqi;
  }

  /* ---- Giriş ---- */
  .intro { position: absolute; inset: 0; z-index: 15; display: grid; place-items: center; text-align: center;
    background: rgba(10,4,24,.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transition: opacity 1.05s cubic-bezier(.22,1,.36,1), visibility 0s linear 1.05s; }
  .pv.in .intro, .pv.man .intro { opacity: 0; visibility: hidden; pointer-events: none; }

  .intro .reveal {
    opacity: 0;
    transform: translate3d(0, .42cqi, 0);
    filter: blur(10px);
    will-change: opacity, transform, filter;
    backface-visibility: hidden;
    transition:
      opacity 1.65s cubic-bezier(.22,1,.36,1),
      transform 1.85s cubic-bezier(.22,1,.36,1),
      filter 1.65s cubic-bezier(.22,1,.36,1);
  }
  .pv.booted .intro .reveal {
    opacity: 1;
    transform: translate3d(0, 0, 0);
    filter: blur(0px);
  }
  .pv.booted .intro .r1 { transition-delay: .12s; }
  .pv.booted .intro .r2 { transition-delay: .62s; }
  .pv.booted .intro .r3 { transition-delay: 1.12s; }

  .intro .name { font-family: var(--serif); font-size: 4.8cqi; letter-spacing: -.025em; line-height: 1; margin: 0; font-weight: 400; }
  .intro .name em { font-style: italic; color: #e7c9ff; }
  .intro .name .sl { font-weight: 200; color: rgba(244,239,253,.35); margin: 0 .3em; }
  .intro .line { margin-top: 2.2cqi; font-family: var(--serif); font-style: italic; font-size: 1.7cqi; color: rgba(244,239,253,.72); }
  .intro .line2 { margin-top: .45cqi; font-family: var(--serif); font-style: italic; font-size: 1.3cqi; color: rgba(244,239,253,.38); }
  .intro .keys { margin-top: 2.1cqi; display: flex; gap: .7cqi; justify-content: center; align-items: center; }
  .kc { display: inline-grid; place-items: center; width: 2.5cqi; height: 2.5cqi; min-width: 26px; min-height: 26px; border: 1px solid rgba(244,239,253,.22); border-radius: .55cqi;

/* ---- İki Aşamalı Ses ve Müzik Mimarisi ---- */
const SoundEngine = (() => {
  let ctx = null, master = null, introGain = null, chillGain = null, chillLp = null, rev = null;
  let introBuf = null, chillBufs = { snow: null, myst: null };
  let introSrc = null, chillSrc = null;
  let muted = false, scene = 'man', chillMode = 'snow';

  const LEAF_FREQS = [220.0, 246.94, 261.63, 293.66, 329.63];

  function ensureCtx() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.85;

    introGain = ctx.createGain(); introGain.gain.value = 0.0001;
    const introLp = ctx.createBiquadFilter(); introLp.type = 'lowpass'; introLp.frequency.value = 2100;
    introLp.connect(introGain);
    introGain.connect(master);
    introGain._lp = introLp;

    chillGain = ctx.createGain(); chillGain.gain.value = 0.0001;
    chillLp = ctx.createBiquadFilter(); chillLp.type = 'lowpass'; chillLp.frequency.value = 1650; chillLp.Q.value = 0.6;
    chillLp.connect(chillGain);

    rev = ctx.createConvolver();
    const sr = ctx.sampleRate, len = Math.floor(sr * 2.8), imp = ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) {
      const d = imp.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
    }
    rev.buffer = imp;
    const revWet = ctx.createGain(); revWet.gain.value = 0.25;
    chillLp.connect(rev); rev.connect(revWet); revWet.connect(chillGain);

    chillGain.connect(master);
    master.connect(ctx.destination);
  }

  function decodeB64(b64) {
    ensureCtx();
    const bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    return new Promise((resolve, reject) => {
      ctx.decodeAudioData(bytes.buffer, buf => resolve(buf), err => reject(err));
    });
  }

  function ensureIntroPlaying() {
    if (!ctx || muted || scene !== 'man') return;
    const playIt = (buf) => {
      if (muted || scene !== 'man') return;
      if (!introSrc) {
        introSrc = ctx.createBufferSource();
        introSrc.buffer = buf;
        introSrc.loop = true;
        introSrc.playbackRate.value = 0.93;
        introSrc.connect(introGain._lp);
        introSrc.start(0);
      }
      const now = ctx.currentTime;
      introGain.gain.cancelScheduledValues(now);
      introGain.gain.setValueAtTime(Math.max(0.0001, introGain.gain.value), now);
      introGain.gain.exponentialRampToValueAtTime(0.24, now + 2.2);
    };
    if (introBuf) playIt(introBuf);
    else decodeB64(AMB_INTRO_B64).then(b => { introBuf = b; playIt(b); });
  }

  function stopIntroSong() {
    if (!ctx || !introGain) return;
    const now = ctx.currentTime;
    introGain.gain.cancelScheduledValues(now);
    introGain.gain.setValueAtTime(Math.max(0.0001, introGain.gain.value), now);
    introGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
    const oldSrc = introSrc;
    introSrc = null;
    if (oldSrc) {
      setTimeout(() => { try { oldSrc.stop(); oldSrc.disconnect(); } catch (e) {} }, 1900);
    }
  }

  function ensureChillPlaying() {
    if (!ctx || muted || scene === 'man') return;
    const key = chillMode;
    const b64 = key === 'snow' ? CHILL_SNOW_B64 : CHILL_MYST_B64;
    const rate = key === 'snow' ? 0.96 : 0.92;
    const targetGain = scene === 'note' ? 0.22 : 0.30;
    const targetLp = scene === 'note' ? 920 : 1750;

    const startChillBuf = (buf) => {
      if (muted || scene === 'man' || chillMode !== key) return;
      if (!chillSrc || chillSrc._mode !== key) {
        if (chillSrc) {
          const prev = chillSrc;
          setTimeout(() => { try { prev.stop(); prev.disconnect(); } catch (e) {} }, 300);
        }
        chillSrc = ctx.createBufferSource();
        chillSrc.buffer = buf;
        chillSrc.loop = true;
        chillSrc.playbackRate.value = rate;
        chillSrc._mode = key;
        chillSrc.connect(chillLp);
        chillSrc.start(0);
      }
      const now = ctx.currentTime;
      chillGain.gain.cancelScheduledValues(now);
      chillGain.gain.setValueAtTime(Math.max(0.0001, chillGain.gain.value), now);
      chillGain.gain.exponentialRampToValueAtTime(targetGain, now + 1.8);

      chillLp.frequency.cancelScheduledValues(now);
      chillLp.frequency.setValueAtTime(Math.max(150, chillLp.frequency.value), now);
      chillLp.frequency.exponentialRampToValueAtTime(targetLp, now + 1.1);
    };

    if (chillBufs[key]) startChillBuf(chillBufs[key]);
    else decodeB64(b64).then(b => { chillBufs[key] = b; startChillBuf(b); });
  }

  function playGlassTone(freq, dur, peakGain, delaySec = 0) {
    if (!ctx || muted) return;
    const now = ctx.currentTime + delaySec;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(peakGain, now + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g);
    g.connect(chillLp);
    osc.start(now);
    osc.stop(now + dur + 0.05);
  }

  return {
    start() {
      ensureCtx();
      if (ctx.state === 'suspended') ctx.resume();
      if (muted) return;
      if (!chillBufs.snow) decodeB64(CHILL_SNOW_B64).then(b => { chillBufs.snow = b; });
      if (!chillBufs.myst) decodeB64(CHILL_MYST_B64).then(b => { chillBufs.myst = b; });
      if (scene === 'man') ensureIntroPlaying();
      else { stopIntroSong(); ensureChillPlaying(); }
    },
    setSceneState(st) {
      scene = st;
      if (!ctx || muted) return;
      if (scene === 'man') {
        if (chillGain) {
          const now = ctx.currentTime;
          chillGain.gain.cancelScheduledValues(now);
          chillGain.gain.setValueAtTime(Math.max(0.0001, chillGain.gain.value), now);
          chillGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.0);
        }
        ensureIntroPlaying();
      } else {
        stopIntroSong();
        ensureChillPlaying();
      }
    },
    switchChillTrack() {
      ensureCtx();
      if (ctx.state === 'suspended') ctx.resume();
      chillMode = chillMode === 'snow' ? 'myst' : 'snow';
      if (!muted && scene !== 'man') {
        const now = ctx.currentTime;
        chillGain.gain.cancelScheduledValues(now);
        chillGain.gain.setValueAtTime(Math.max(0.0001, chillGain.gain.value), now);
        chillGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
        setTimeout(() => ensureChillPlaying(), 260);
      }
      return chillMode;
    },
    getChillMode() { return chillMode; },
    toggleMute() {
      muted = !muted;
      ensureCtx();
      const now = ctx.currentTime;
      if (muted) {
        master.gain.cancelScheduledValues(now);
        master.gain.setValueAtTime(Math.max(0.0001, master.gain.value), now);
        master.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
      } else {
        if (ctx.state === 'suspended') ctx.resume();
        master.gain.cancelScheduledValues(now);
        master.gain.setValueAtTime(0.0001, now);
        master.gain.exponentialRampToValueAtTime(0.85, now + 0.45);
        this.start();
      }
      return !muted;
    },
    onSeamBreath() {
      playGlassTone(220.0, 2.2, 0.008, 0);
    },
    onLeafSwitch(idx) {
      const f = LEAF_FREQS[idx % LEAF_FREQS.length];
      playGlassTone(f * 0.5, 1.1, 0.014, 0);
      playGlassTone(f, 1.4, 0.010, 0.05);
    },
    onDossierToggle(opening) {
      if (opening) {
        playGlassTone(164.81, 1.2, 0.014, 0);
        playGlassTone(220.0, 1.6, 0.011, 0.07);
      } else {
        playGlassTone(220.0, 1.0, 0.011, 0);
        playGlassTone(164.81, 1.3, 0.012, 0.06);
      }
    }
  };
})();
window.SoundEngine = SoundEngine;

/* ---- Canlı Yorumlar & Moderasyon Motoru (GitHub comments.json + ntfy.sh Gerçek Zamanlı Kanal) ---- */
const CommentEngine = (() => {
  const TOPIC = "celil_fikir_agaci_yorumlar_2026_v1";
  const VERIFY_HASH = "22ac0d7a379c94e059a4fd573c5fa79ae3f95eefcd7acddcf251e2f2fecb9b61";
  const itemsMap = new Map();
  const deletedSet = new Set();
  const pendingAuthDel = [];
  let adminToken = localStorage.getItem("fa_admin_token") || "";
  let myIds = [];
  try { myIds = JSON.parse(localStorage.getItem("fa_my_comment_ids") || "[]"); } catch (e) {}
  try {
    const localDels = JSON.parse(localStorage.getItem("fa_deleted_ids") || "[]");
    localDels.forEach(id => deletedSet.add(id));
  } catch (e) {}

  let onUpdateCb = null;

  async function sha256Hex(str) {
    const buf = new TextEncoder().encode(str);
    const hashBuf = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function notify() {
    if (onUpdateCb) onUpdateCb(getVisibleComments());
  }

  function getVisibleComments() {
    const arr = [];
    itemsMap.forEach((v, k) => {
      if (!deletedSet.has(k) && v && v.user && v.text) arr.push(v);
    });
    arr.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    return arr;
  }

  async function processEventObj(obj) {
    if (!obj || typeof obj !== "object") return;
    if (obj.type === "add" && obj.id && obj.user && obj.text) {
      if (!deletedSet.has(obj.id)) {
        itemsMap.set(obj.id, {
          id: String(obj.id).slice(0, 40),
          user: String(obj.user).trim().slice(0, 28),
          text: String(obj.text).trim().slice(0, 420),
          leaf: typeof obj.leaf === "number" ? obj.leaf : 0,
          ts: Number(obj.ts) || Date.now()
        });
        notify();
      }
    } else if (obj.type === "del" && obj.targetId) {
      if (obj.auth) {
        const check = await sha256Hex("verify:" + obj.auth);
        if (check === VERIFY_HASH) {
          deletedSet.add(obj.targetId);
          itemsMap.delete(obj.targetId);
          notify();
        }
      } else if (obj.selfDel && myIds.includes(obj.targetId)) {
        deletedSet.add(obj.targetId);
        itemsMap.delete(obj.targetId);
        notify();
      }
    }
  }

  async function init(cb) {
    onUpdateCb = cb;
    // URL parametresi ile hızlı yönetici kilidi (?admin=...)
    const urlP = new URLSearchParams(window.location.search).get("admin");
    if (urlP) await unlockAdmin(urlP);

    // 1. Kalıcı comments.json arşivini yükle (GitHub Pages üzerinde)
    try {
      const r = await fetch("comments.json?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) {
        const data = await r.json();
        if (Array.isArray(data.deleted)) data.deleted.forEach(id => deletedSet.add(id));
        if (Array.isArray(data.comments)) {
          data.comments.forEach(c => {
            if (c && c.id && !deletedSet.has(c.id)) itemsMap.set(c.id, c);
          });
        }
        notify();
      }
    } catch (e) {}

    // 2. Gerçek zamanlı ntfy akışındaki son yorumları ve silmeleri çek
    try {
      const r2 = await fetch("https://ntfy.sh/" + TOPIC + "/json?poll=1&since=all", { cache: "no-store" });
      if (r2.ok) {
        const txt = await r2.text();
        const lines = txt.split("\n").filter(Boolean);
        for (const line of lines) {
          try {
            const env = JSON.parse(line);
            if (env.event === "message" && env.message) {
              const payload = JSON.parse(env.message);
              await processEventObj(payload);
            }
          } catch (e) {}
        }
      }
    } catch (e) {}

    // 3. Canlı SSE dinleyicisi (Sayfa açıkken gelen yorum/silme anında düşer)
    try {
      const es = new EventSource("https://ntfy.sh/" + TOPIC + "/sse");
      es.onmessage = async (ev) => {
        try {
          const env = JSON.parse(ev.data);
          if (env.event === "message" && env.message) {
            const payload = JSON.parse(env.message);
            await processEventObj(payload);
          }
        } catch (e) {}
      };
    } catch (e) {}
  }

  async function postComment(user, text, leafIdx) {
    const cleanUser = String(user || "").trim().slice(0, 28);
    const cleanText = String(text || "").trim().slice(0, 420);
    if (!cleanUser || !cleanText) throw new Error("empty");
    if (/https?:\/\/|www\.|\.com\/|\.ru\/|\.xyz\//i.test(cleanText)) {
      throw new Error("link_spam");
    }
    const lastPost = Number(localStorage.getItem("fa_last_post_ts") || 0);
    if (Date.now() - lastPost < 12000) {
      throw new Error("rate_limit");
    }
    const id = "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
    const item = { type: "add", id, user: cleanUser, text: cleanText, leaf: leafIdx, ts: Date.now() };

    itemsMap.set(id, { id, user: cleanUser, text: cleanText, leaf: leafIdx, ts: item.ts });
    myIds.push(id);
    localStorage.setItem("fa_my_comment_ids", JSON.stringify(myIds));
    localStorage.setItem("fa_last_post_ts", String(Date.now()));
    localStorage.setItem("fa_nick", cleanUser);
    notify();

    await fetch("https://ntfy.sh/" + TOPIC, {
      method: "POST",
      body: JSON.stringify(item)
    });
    return item;
  }

  async function deleteComment(targetId) {
    deletedSet.add(targetId);
    itemsMap.delete(targetId);
    try {
      const arr = Array.from(deletedSet);
      localStorage.setItem("fa_deleted_ids", JSON.stringify(arr));
    } catch (e) {}
    notify();

    const payload = { type: "del", targetId, ts: Date.now() };
    if (adminToken) payload.auth = adminToken;
    else payload.selfDel = true;

    try {
      await fetch("https://ntfy.sh/" + TOPIC, {
        method: "POST",
        body: JSON.stringify(payload)
      });
    } catch (e) {}
  }

  async function unlockAdmin(pass) {
    const h1 = await sha256Hex("celil-salt:" + String(pass || "").trim());
    const h2 = await sha256Hex("verify:" + h1);
    if (h2 === VERIFY_HASH) {
      adminToken = h1;
      localStorage.setItem("fa_admin_token", h1);
      notify();
      return true;
    }
    return false;
  }

  function isAdmin() { return Boolean(adminToken); }
  function canDelete(id) { return Boolean(adminToken) || myIds.includes(id); }

  return { init, postComment, deleteComment, unlockAdmin, isAdmin, canDelete, getVisibleComments };
})();

    }
  };

  const renderLeafText = (idx, lang) => {
    const lf = LEAVES[idx];
    const t = lf[lang];
    poster.dataset.size = lf.size;
    pv.querySelector('.p1').textContent = t.p[0];
    pv.querySelector('.p2').textContent = t.p[1];
    pv.querySelector('.p3').textContent = t.p[2];
    if (dosSrc) dosSrc.textContent = t.src;
    if (dosDate) dosDate.textContent = lang === 'en' ? lf.dateEn : lf.dateTr;
    if (dosSteps) {
      dosSteps.innerHTML = t.steps.map(st => {
        let inner = '<div class="dos-kicker">' + st.k + '</div>';
        if (st.q) inner += '<p class="dos-q">' + st.q + '</p>';
        if (st.b) inner += '<p class="dos-body">' + st.b + '</p>';
        if (st.orig) inner += '<div class="dos-orig">' + st.orig + '</div>';
        if (st.linkUrl) inner += '<a class="dos-link" href="' + st.linkUrl + '" target="_blank" rel="noopener">' + st.linkLabel + '</a>';
        return '<div class="dos-step">' + inner + '</div>';
      }).join('');
    }
    pv.lang = lang;
    updateHudLabels();
    renderCommentsList(CommentEngine.getVisibleComments());
  };

  const setLang = l => {
    curLang = l;
    renderLeafText(curIdx, curLang);
    pv.querySelector('.mtxt').innerHTML = MANI[l].map(s => '<span class="s">' + s + ' </span>').join('');
  };
  setLang('tr');

  CommentEngine.init(list => renderCommentsList(list));

  const goLeaf = (delta) => {
    if (busy) return;
    busy = true;
    const nextIdx = (curIdx + delta + LEAVES.length) % LEAVES.length;
    pv.classList.remove('noted', 'comments-open');
    pv.classList.add('switching');
    SoundEngine.setSceneState('in');
    SoundEngine.onLeafSwitch(nextIdx);
    if (window.switchSculpture) window.switchSculpture(nextIdx);
    setTimeout(() => {
      curIdx = nextIdx;
      renderLeafText(curIdx, curLang);
      requestAnimationFrame(() => {
        pv.classList.remove('switching');
        setTimeout(() => { busy = false; }, 280);
      });
    }, 240);
  };

  const triggerIntro = () => {
    pv.classList.remove('in', 'noted', 'comments-open', 'man', 'booted', 'switching');
    requestAnimationFrame(() => requestAnimationFrame(() => pv.classList.add('booted')));
  };
  triggerIntro();

  pv.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    setLang(b.dataset.lang);
    pv.classList.add('man');
    SoundEngine.setSceneState('man');
    SoundEngine.start();
  }));
  const enter = () => {
    pv.classList.remove('man');
    pv.classList.add('in');
    SoundEngine.setSceneState('in');
  };
  pv.querySelector('.mani').addEventListener('click', enter);

  const toggleNote = (forceState) => {
    if (!pv.classList.contains('in')) return;
    pv.classList.remove('comments-open');
    const shouldOpen = typeof forceState === 'boolean' ? forceState : !pv.classList.contains('noted');
    if (!shouldOpen) {
      pv.classList.remove('noted');
      SoundEngine.setSceneState('in');
      SoundEngine.onDossierToggle(false);
    } else {
      pv.classList.add('noted');
      SoundEngine.setSceneState('note');
      SoundEngine.onDossierToggle(true);
    }
    updateHudLabels();
  };

  const toggleComments = (forceState) => {
    if (!pv.classList.contains('in')) return;
    pv.classList.remove('noted');
    const shouldOpen = typeof forceState === 'boolean' ? forceState : !pv.classList.contains('comments-open');
    if (!shouldOpen) {
      pv.classList.remove('comments-open');
      SoundEngine.setSceneState('in');
      SoundEngine.onDossierToggle(false);
    } else {
      pv.classList.add('comments-open');
      SoundEngine.setSceneState('note');
      SoundEngine.onDossierToggle(true);
    }
    updateHudLabels();
  };

  posterCard.addEventListener('click', e => {
    e.stopPropagation();
    toggleNote(true);
  });
  dosClose.addEventListener('click', e => {
    e.stopPropagation();
    toggleNote(false);
  });
  cClose.addEventListener('click', e => {
    e.stopPropagation();
    toggleComments(false);
  });

  // Yönetici kilidi açma
  cModToggle.addEventListener('click', e => {
    e.stopPropagation();
    cModBar.classList.toggle('show');
    if (cModBar.classList.contains('show')) cModInp.focus();
  });
  const handleModUnlock = async () => {
    const ok = await CommentEngine.unlockAdmin(cModInp.value);
    if (ok) {
      cModInp.value = '';
      cModBar.classList.remove('show');
      cStatus.textContent = curLang === 'en' ? 'Moderator mode unlocked.' : 'Yönetici modu aktif: tüm yorumları silebilirsin.';
      setTimeout(() => { if (cStatus) cStatus.textContent = ''; }, 3000);
      renderCommentsList(CommentEngine.getVisibleComments());
    } else {
      cStatus.textContent = curLang === 'en' ? 'Invalid key.' : 'Geçersiz anahtar.';
    }
  };
  cModApply.addEventListener('click', e => { e.stopPropagation(); handleModUnlock(); });
  cModInp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); handleModUnlock(); }
  });

  // Form içindeyken klavye yön tuşlarının yaprak değiştirmesini engelle
  pv.querySelector('#c-drawer').addEventListener('keydown', e => e.stopPropagation());
  pv.querySelector('#c-drawer').addEventListener('pointerdown', e => e.stopPropagation());

  cForm.addEventListener('submit', async e => {
    e.preventDefault();
    e.stopPropagation();
    cSend.disabled = true;
    cStatus.textContent = curLang === 'en' ? 'Sending...' : 'Gönderiliyor...';
    try {
      await CommentEngine.postComment(cUser.value, cText.value, curIdx);
      cText.value = '';
      cStatus.textContent = curLang === 'en' ? 'Your reflection has been added.' : 'İzin ağaca eklendi.';
      setTimeout(() => { if (cStatus) cStatus.textContent = ''; }, 3000);
    } catch (err) {
      if (err.message === 'rate_limit') {
        cStatus.textContent = curLang === 'en' ? 'Please wait a few seconds before posting again.' : 'Yeni bir yorum için lütfen birkaç saniye bekle.';
      } else if (err.message === 'link_spam') {
        cStatus.textContent = curLang === 'en' ? 'Links are not allowed in reflections.' : 'Spam koruması nedeniyle yorumlarda bağlantıya izin verilmiyor.';
      } else {
        cStatus.textContent = curLang === 'en' ? 'Could not send.' : 'Gönderilemedi.';
      }
    } finally {
      cSend.disabled = false;
    }
  });

  document.addEventListener('keydown', e => {
    if (pv.classList.contains('man') && (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); enter(); return; }
    if (!pv.classList.contains('in')) return;
    if (e.key === 'Escape' && (pv.classList.contains('noted') || pv.classList.contains('comments-open'))) {
      e.preventDefault();
      pv.classList.remove('noted', 'comments-open');
      SoundEngine.setSceneState('in');
      updateHudLabels();
      return;
    }
    if (e.key === 'ArrowRight') { e.preventDefault(); goLeaf(1); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); goLeaf(-1); }
    if (e.key === 'ArrowDown' && !pv.classList.contains('noted')) {
      e.preventDefault(); toggleNote(true);
    }
    if (e.key === 'ArrowUp' && pv.classList.contains('noted')) {
      e.preventDefault(); toggleNote(false);
    }
  });

  pv.querySelector('#btn-prev').onclick = e => { e.stopPropagation(); goLeaf(-1); };
  pv.querySelector('#btn-next').onclick = e => { e.stopPropagation(); goLeaf(1); };
  pv.querySelector('#btn-note').onclick = e => { e.stopPropagation(); toggleNote(); };
  btnComments.onclick = e => { e.stopPropagation(); toggleComments(); };
  btnTrack.onclick = e => {
    e.stopPropagation();
    SoundEngine.switchChillTrack();
    updateHudLabels();
  };
  pv.querySelector('#btn-lang').onclick = e => { e.stopPropagation(); setLang(curLang === 'tr' ? 'en' : 'tr'); };
  btnMute.onclick = e => {
    e.stopPropagation();
    const on = SoundEngine.toggleMute();
    btnMute.textContent = on ? (curLang === 'en' ? 'Sound: On' : 'Ses: Açık') : (curLang === 'en' ? 'Sound: Off' : 'Ses: Kapalı');
  };
};
</script>

}

function glint(ctx, x, y, r, a, col) {
  if (a <= 0) return;
  ctx.globalAlpha = a; ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
}

const CACHE = new Array(OBJ_SRCS.length).fill(null);

function makeScene(pv, initialItem) {
  CACHE[0] = initialItem;
  pv.appendChild(document.getElementById('tpl-' + pv.dataset.layout).content.cloneNode(true));
  const cv = pv.querySelector('canvas.fx'), ctx = cv.getContext('2d');
  const layer = document.createElement('canvas'), lx = layer.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const resize = () => { dpr = Math.min(devicePixelRatio || 1, 1.5); W = cv.clientWidth * dpr; H = cv.clientHeight * dpr; cv.width = layer.width = W; cv.height = layer.height = H; };
  new ResizeObserver(resize).observe(cv); resize();
  const m = { x: 0, y: 0, tx: 0, ty: 0 };
  pv.addEventListener('pointermove', e => { const r = pv.getBoundingClientRect(); m.tx = (e.clientX - r.left) / r.width * 2 - 1; m.ty = (e.clientY - r.top) / r.height * 2 - 1; });
  pv.addEventListener('pointerleave', () => { m.tx = 0; m.ty = 0; });
  pv.querySelector('.fsbtn')?.addEventListener('click', e => { e.stopPropagation(); pv.classList.toggle('full'); });
  let T = 0, last = performance.now(), visible = true;
  new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(pv);

  let curItem = initialItem, offs = [];
  let fadeAlpha = 1, fadeDir = 0, pendingIdx = -1;

  const reset = () => {
    const heart = curItem.heart, rmax = curItem.rmax;
    offs = curItem.regions.map(r => {
      let dx = r.cx - heart.x, dy = r.cy - heart.y; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const d = rnd(.007, .014) * (.45 + l / rmax);
      return { dx: dx * d, dy: dy * d - .004, rot: rnd(-.035, .035), ph: rnd(0, TAU) };
    });
  };
  reset();

  const CY = 11.5, tc = 1.8, tcD = 2.4, ts = tc + tcD, tsD = 2.4, th = ts + tsD, thD = 1.6, tb = th + thD, tbD = 2.4, tf = tb + tbD;
  let ct = 1.0;
  pv.addEventListener('pointerdown', e => { if (e.target.closest('.fsbtn,.intro,.mani')) return; if (ct < tc - .05 || ct > tf) { reset(); ct = tc - .05; } });

  window.switchSculpture = (idx) => {
    pendingIdx = idx;
    fadeDir = -1;
    if (!CACHE[idx]) {
      loadObj(OBJ_SRCS[idx]).then(r => { CACHE[idx] = analyze(r); });
    }
  };

  let bgIdx = 1;
  function preloadNext() {
    if (bgIdx >= OBJ_SRCS.length) return;
    const i = bgIdx++;
    if (!CACHE[i]) {
      loadObj(OBJ_SRCS[i]).then(r => { CACHE[i] = analyze(r); setTimeout(preloadNext, 120); });
    } else {
      setTimeout(preloadNext, 60);
    }
  }
  setTimeout(preloadNext, 800);

  const geo = () => {
    const D = Math.min(H * .78, W * .5), cx = W * .29, cy = H * .5 + Math.sin(T * .7) * H * .01;
    return { D, x: cx - D / 2 + m.x * -H * .01, y: cy - D / 2 + m.y * -H * .008, k: D / curItem.rose.w };
  };
  const radial = (cx, cy, r, stops) => { const g = lx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, r)); stops.forEach(([o, c]) => g.addColorStop(clamp(o), c)); return g; };

  const halo = (g, a) => {
    const bx = g.x + g.D * .5, by = g.y + g.D * .42, r = g.D * .55, gr = ctx.createRadialGradient(bx, by, 0, bx, by, r);
    gr.addColorStop(0, 'rgba(190,110,255,' + (.26 * a) + ')'); gr.addColorStop(1, 'rgba(190,110,255,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1; ctx.fillStyle = gr; ctx.fillRect(bx - r, by - r, r * 2, r * 2);
  };

  const draw = dt => {
    m.x += (m.tx - m.x) * Math.min(1, dt * 4); m.y += (m.ty - m.y) * Math.min(1, dt * 4);
    if (fadeDir === -1) {
      fadeAlpha = Math.max(0, fadeAlpha - dt * 3.8);
      if (fadeAlpha <= 0.02 && pendingIdx >= 0 && CACHE[pendingIdx]) {
        curItem = CACHE[pendingIdx];
        pendingIdx = -1;
        reset();
        ct = 1.05;
        fadeDir = 1;
      }
    } else if (fadeDir === 1) {
      fadeAlpha = Math.min(1, fadeAlpha + dt * 3.2);
      if (fadeAlpha >= 0.999) { fadeAlpha = 1; fadeDir = 0; }
    }

    const prevCt = ct;
    const isReading = pv.classList.contains('noted') || pv.classList.contains('comments-open');
    const effDt = isReading ? dt * 0.28 : dt;
    if (pv.classList.contains('in') || !pv.querySelector('.intro')) { ct += effDt; } else { ct = 0.5; }
    if (prevCt < tc && ct >= tc && pv.classList.contains('in') && !isReading && window.SoundEngine && window.SoundEngine.onSeamBreath) {
      window.SoundEngine.onSeamBreath();
    }
    if (ct > CY) { ct = 0; reset(); }

    const readDim = isReading ? 0.46 : 1.0;
    const effAlpha = fadeAlpha * readDim;

    const rose = curItem.rose, heart = curItem.heart, rmax = curItem.rmax;
    const g = geo(), hx = g.x + heart.x * g.k, hy = g.y + heart.y * g.k, Rmax = rmax * g.k;
    let p = 0;
    if (ct >= ts && ct < th) p = sine((ct - ts) / tsD);
    else if (ct >= th && ct < tb) p = 1;
    else if (ct >= tb && ct < tf) p = 1 - sine((ct - tb) / tbD);
    halo(g, (1 + .3 * p) * effAlpha);

    if (p < .002) {
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = effAlpha; ctx.drawImage(rose.canvas, g.x, g.y, g.D, g.D);
    } else {
      const gr = ctx.createRadialGradient(hx, hy + g.D * .06, 0, hx, hy + g.D * .06, g.D * .38);
      gr.addColorStop(0, 'rgba(255,238,255,' + (.55 * p * effAlpha) + ')'); gr.addColorStop(.45, 'rgba(205,140,255,' + (.25 * p * effAlpha) + ')'); gr.addColorStop(1, 'rgba(205,140,255,0)');
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1; ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = effAlpha;
      curItem.regions.forEach((r, i) => {
        const o = offs[i] || { dx: 0, dy: 0, rot: 0, ph: 0 }, fl = Math.sin(T * .9 + o.ph) * p * H * .003;
        ctx.save(); ctx.translate(g.x + r.cx * g.k + o.dx * H * p, g.y + r.cy * g.k + o.dy * H * p + fl); ctx.rotate(o.rot * p);
        ctx.drawImage(r.cv, (r.x - r.cx) * g.k, (r.y - r.cy) * g.k, r.w * g.k, r.h * g.k); ctx.restore();
      });
    }

    let reveal = 0, sa = 0;
    if (ct >= tc) { reveal = clamp((ct - tc) / tcD); sa = ct < ts ? 1 : ct < tf ? 1 - .75 * sine((ct - ts) / .9) * (1 - sine((ct - tb) / tbD)) : 1 - clamp((ct - tf) / 1.3); }
    if (sa > 0 && p < .35) {
      const fade = (1 - clamp(p / .35)) * effAlpha, R = Rmax * (reveal * 1.15), fr = Rmax * .22;
      lx.setTransform(1, 0, 0, 1, 0, 0);
      lx.globalCompositeOperation = 'source-over'; lx.globalAlpha = 1; lx.clearRect(0, 0, W, H);
      lx.drawImage(curItem.seam, g.x, g.y, g.D, g.D);
      lx.globalCompositeOperation = 'destination-in'; lx.fillStyle = radial(hx, hy, R, [[0, 'rgba(0,0,0,.75)'], [1 - fr / Math.max(R, 1), 'rgba(0,0,0,.75)'], [1, 'rgba(0,0,0,0)']]); lx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = sa * fade; ctx.drawImage(layer, 0, 0);
      if (reveal < 1) {
        lx.globalCompositeOperation = 'source-over'; lx.clearRect(0, 0, W, H);
        lx.drawImage(curItem.seam, g.x, g.y, g.D, g.D);
        const a0 = 1 - fr / Math.max(R, 1);
        lx.globalCompositeOperation = 'destination-in'; lx.fillStyle = radial(hx, hy, R, [[0, 'rgba(0,0,0,0)'], [a0, 'rgba(0,0,0,0)'], [(a0 + 1) / 2, 'rgba(0,0,0,1)'], [1, 'rgba(0,0,0,0)']]); lx.fillRect(0, 0, W, H);
        ctx.globalAlpha = sa * fade; ctx.drawImage(layer, 0, 0); ctx.drawImage(layer, 0, 0);
      }
    }
    if (ct >= tc - .3 && ct < tc + 1.4) {
      const k = clamp((ct - tc + .3) / .5) * (1 - clamp((ct - tc - .3) / 1.1)) * fadeAlpha;
      ctx.globalCompositeOperation = 'lighter'; glint(ctx, hx, hy, H * .022 * (.6 + .4 * k), .85 * k, '#fbf3ff');
    }
    ctx.globalAlpha = 1;
  };

  (function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
    if (visible || pv.classList.contains('full')) { T += dt; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.clearRect(0, 0, W, H); draw(dt); }
    requestAnimationFrame(loop);
  })(performance.now());
}

loadObj(OBJ_SRCS[0]).then(rose => {
  const item0 = analyze(rose);
  document.querySelectorAll('[data-scene]').forEach(pv => makeScene(pv, item0));
  window.initUI && window.initUI();
  document.querySelectorAll('canvas.grain').forEach(c => {
    c.width = 220; c.height = 220; const x = c.getContext('2d'), d = x.createImageData(220, 220);
    for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    x.putImageData(d, 0, 0);
  });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.pv.full').forEach(p => p.classList.remove('full')); });
</script>
</body>
